const sheet = $('#sheet'), backdrop = $('#backdrop'), sheetBody = $('#sheet-body');
let lastFocus = null;
// Sheets stack: a sheet opened from another one remembers it, and Back (or finishing an edit) returns
// there, redrawn from the latest data, instead of dropping you on the main screen.
// A view is { key, label, render }: the same key redraws in place; a new key goes on top.
const nav = { stack: [], cur: null };
const backHTML = () => (nav.stack.length ? `<button type="button" class="textbtn sheet-back" data-act="sheet-back">‹ ${esc(nav.stack.at(-1).label)}</button>` : '');
function openSheet(kind, html, view = {}) {
  const key = view.key ?? kind;
  if (!sheet.hidden && nav.cur && nav.cur.key !== key) nav.stack.push(nav.cur);
  nav.cur = { kind, key, label: view.label ?? 'Back', render: view.render ?? (() => html) };
  state.sheet = kind;
  sheetBody.innerHTML = backHTML() + html;
  if (sheet.hidden) {
    lastFocus = document.activeElement;
    sheet.hidden = backdrop.hidden = false;
    requestAnimationFrame(() => { sheet.classList.add('open'); backdrop.classList.add('open'); });
    tg?.BackButton?.show();
  }
  const first = sheetBody.querySelector('input') || sheetBody.querySelector('button');
  setTimeout(() => first?.focus({ preventScroll: true }), 60);
}
/** Back one level: the sheet underneath, redrawn; from the first sheet, close. */
async function sheetBack() {
  const prev = nav.stack.pop();
  if (!prev) return closeSheet();
  nav.cur = null; // not pushed again
  haptic.pick();
  const html = await prev.render();
  if (html == null) return sheetBack(); // what it showed is gone (e.g. deleted)
  openSheet(prev.kind, html, prev);
}
/** Redraw the sheet you're on (after a change elsewhere). */
async function sheetRedraw() {
  if (!nav.cur) return;
  const html = await nav.cur.render();
  if (html == null) return sheetBack();
  sheetBody.innerHTML = backHTML() + html;
}
function closeSheet() {
  nav.stack = [];
  nav.cur = null;
  if (sheet.hidden) return;
  state.sheet = null;
  sheet.classList.remove('open');
  backdrop.classList.remove('open');
  sheet.style.transform = '';
  tg?.BackButton?.hide();
  setTimeout(() => { if (!state.sheet) { sheet.hidden = backdrop.hidden = true; sheetBody.innerHTML = ''; } }, reduceMotion ? 0 : 420);
  lastFocus?.focus?.({ preventScroll: true });
}
(() => {
  let startY = null;
  const grab = $('#grabber');
  grab.addEventListener('pointerdown', (e) => { startY = e.clientY; grab.setPointerCapture(e.pointerId); sheet.style.transition = 'none'; });
  grab.addEventListener('pointermove', (e) => { if (startY !== null) sheet.style.transform = `translateY(${Math.max(0, e.clientY - startY)}px)`; });
  grab.addEventListener('pointerup', (e) => {
    if (startY === null) return;
    const dy = e.clientY - startY;
    startY = null; sheet.style.transition = ''; sheet.style.transform = '';
    if (dy > 90) closeSheet();
  });
})();

/* ---------- earnings: a donut of where the money came from ---------- */
// Categorical slots for the dark surface, in fixed order (validated: adjacent CVD ΔE ≥ 8.4, ≥ 3:1 on the sheet).
const EARN_COLORS = ['#3987e5', '#d95926', '#199e70', '#c98500', '#d55181', '#9085e9'];
const OTHER_COLOR = '#7085ad';
/** At most six slices: the biggest sources, then what passed-on money left you, then "Other" for the rest. */
function earningParts(d) {
  const { sources, keptPassedOn } = d.earnedFrom;
  const room = 6 - (keptPassedOn ? 1 : 0);
  const shown = sources.length <= room ? sources : sources.slice(0, room - 1);
  const rest = sources.slice(shown.length);
  const parts = shown.map((x) => ({ ...x, kind: 'source', names: [x.name] }));
  if (keptPassedOn) parts.push({ name: 'Kept from passed-on money', amount: keptPassedOn, count: 0, kind: 'kept' });
  parts.forEach((p, i) => (p.color = EARN_COLORS[i]));
  if (rest.length) parts.push({ name: `Other (${rest.length})`, amount: rest.reduce((a, x) => a + x.amount, 0), count: rest.reduce((a, x) => a + x.count, 0), kind: 'other', names: rest.map((x) => x.name), color: OTHER_COLOR });
  return parts;
}
const share = (part, total) => { const p = (100 * part) / total; return p < 1 ? '<1 %' : `${Math.round(p)} %`; };
function donutSVG(parts, total) {
  const C = 100, R = 94, r = 62;
  const at = (rad, a) => `${(C + rad * Math.cos(a)).toFixed(2)} ${(C + rad * Math.sin(a)).toFixed(2)}`;
  let a = -Math.PI / 2;
  return parts.map((p, i) => {
    const sweep = (2 * Math.PI * p.amount) / total, b = a + sweep, large = sweep > Math.PI ? 1 : 0;
    const d = sweep > 2 * Math.PI - 1e-4 // one part: a whole ring
      ? `M ${at(R, -Math.PI / 2)} A ${R} ${R} 0 1 1 ${at(R, Math.PI / 2)} A ${R} ${R} 0 1 1 ${at(R, -Math.PI / 2)} M ${at(r, -Math.PI / 2)} A ${r} ${r} 0 1 0 ${at(r, Math.PI / 2)} A ${r} ${r} 0 1 0 ${at(r, -Math.PI / 2)} Z`
      : `M ${at(R, a)} A ${R} ${R} 0 ${large} 1 ${at(R, b)} L ${at(r, b)} A ${r} ${r} 0 ${large} 0 ${at(r, a)} Z`;
    a = b;
    return `<path class="slice" data-act="earn-slice" data-i="${i}" d="${d}" fill="${p.color}" fill-rule="evenodd" stroke="#101f4c" stroke-width="2" stroke-linejoin="round"><title>${esc(p.name)}: ${eur0(p.amount)} (${share(p.amount, total)})</title></path>`;
  }).join('');
}
function earningsHTML(d) {

function confetti() {
  if (reduceMotion) return;
  const colors = ['#38e8d6', '#ffd166', '#8f86ff', '#3ee0a1', '#e0598b'];
  const c = document.createElement('canvas');
  c.className = 'confetti';
  document.body.appendChild(c);
  const ctx = c.getContext('2d'), dpr = devicePixelRatio || 1;
  c.width = innerWidth * dpr; c.height = innerHeight * dpr; ctx.scale(dpr, dpr);
  const bits = Array.from({ length: 80 }, () => ({ x: innerWidth / 2, y: innerHeight * 0.6, vx: (Math.random() - 0.5) * 11, vy: -Math.random() * 13 - 5, r: 2 + Math.random() * 4, c: colors[Math.floor(Math.random() * colors.length)] }));
  const t0 = performance.now();
  const step = (now) => {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const b of bits) { b.vy += 0.4; b.x += b.vx; b.y += b.vy; ctx.fillStyle = b.c; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill(); }
    if (now - t0 < 1700) requestAnimationFrame(step); else c.remove();
  };
  requestAnimationFrame(step);
}

// Telegram and the app edit the same payments: pick up what changed in the chat when you come back,
// and every half minute while you look. Never while a sheet is open under your thumb.
async function refresh() {
  if (document.hidden || state.sheet || !state.cur) return;
  try {
    const fresh = await api('/api/summary');
    if (JSON.stringify(fresh) !== JSON.stringify(state.cur)) accept(fresh);
    if (state.view.month !== fresh.month) {
      const other = await api(`/api/summary?month=${state.view.month}`);
      if (JSON.stringify(other) !== JSON.stringify(state.view)) accept(other);
    }
  } catch { /* offline for a moment: try again next time */ }
}
document.addEventListener('visibilitychange', refresh);
TG?.onEvent?.('activated', refresh);
setInterval(refresh, 30_000);

}

    haptic.pick();
    const n = Number(el.dataset.n), cat = el.dataset.cat;
    el.setAttribute('aria-pressed', 'true');
    api('/api/tx', { n, category: cat, month: state.view.month }).then(accept).catch((e) => toast(e.message));
    state.sortIndex++;
    setTimeout(() => {
      sheetBody.innerHTML = sortHTML();
      if (state.sortIndex >= state.sortQueue.length) { haptic.ok(); confetti(); }
    }, 170);
  },
  // ＋ New: type what it is ("🎮 Games"); it becomes a category and is picked right away.
  'new-cat': (el) => {
    haptic.tap();
    const tiles = el.closest('.tiles');
    if (!tiles.nextElementSibling?.classList.contains('new-cat')) {
      // Not a <form>: in the cash sheet these tiles already sit inside one, and forms can't nest.
      tiles.insertAdjacentHTML('afterend', `<div class="new-cat" data-for="${el.dataset.for}" ${el.dataset.n ? `data-n="${el.dataset.n}"` : ''}>
        <input maxlength="30" placeholder="🎮 Games" autocomplete="off" enterkeyhint="done" aria-label="New category name"><button type="button" data-act="add-cat">Add</button></div>`);
    }
    tiles.nextElementSibling.querySelector('input').focus();
  },
  'add-cat': (el) => addCategory(el.closest('.new-cat')),
  'edit-details': () => {
    const box = $('#details');
    box.hidden = !box.hidden;
    if (!box.hidden) $('#ed-label').focus();
  },
  'save-details': (el) => {
    const n = Number(el.dataset.n), t = findTx(n), body = { n, label: $('#ed-label').value, month: state.view.month };
    if ($('#ed-amount')) {
      const cents = parseEuro($('#ed-amount').value);
      if (!cents) { haptic.err(); toast('Enter an amount, e.g. 4,50.'); return; }
      body.amount = Math.sign(t.amount) * cents;
      body.ts = $('#ed-ts').value.slice(0, 16);
    }
    mutate('/api/tx', body, () => { haptic.ok(); toast('Saved'); if (state.sheet === 'edit') openEditor(n); });
  },
  'cat-del': async (el) => {
    const m = catMeta(el.dataset.cat);
    if (!(await ask(`Delete ${m.emoji} ${m.name}? Its payments go back to “to sort”.`))) return;
    mutate('/api/category', { remove: el.dataset.cat, month: state.view.month }, () => { toast(`${m.name} deleted`); sheetRedraw(); });
  },
  'sort-skip': () => { state.sortIndex++; sheetBody.innerHTML = sortHTML(); },
  cash: () => {
    haptic.tap();
    Object.assign(state, { cashDir: -1, cashAmount: '', cashNote: '', cashCat: null, cashNewCat: null });
    openSheet('cash', cashHTML());
  },
  'cash-dir': (el) => {
    haptic.pick();
    state.cashAmount = $('#cash-amount').value;
    state.cashNote = $('#cash-note').value;
    state.cashDir = Number(el.dataset.dir);
    sheetBody.innerHTML = cashHTML();
    updateCashButton();
  },
  'cash-cat': (el) => {
    state.cashNewCat = null;
    haptic.pick();
    state.cashCat = state.cashCat === el.dataset.cat ? null : el.dataset.cat;
    $$('[data-act="cash-cat"]', sheetBody).forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.cat === state.cashCat)));
  },
};
function updateCashButton() {
  const cents = parseEuro($('#cash-amount')?.value);
  const btn = $('#cash-submit');
  if (btn) btn.textContent = cents ? `Drop in ${eur(state.cashDir * cents, true)}` : 'Drop it in';
}

/* ---------- drag a buoy into a category ---------- */
const drag = { el: null, n: null, sx: 0, sy: 0, ox: 0, oy: 0, active: false, hot: null, justDragged: false };
function showDrains() {
  $('#drain-grid').innerHTML = Object.keys(CATS).map((id, i) => {
    const m = catMeta(id);
    return `<div class="drain" data-cat="${id}" style="--c:${m.c};--i:${i}"><span class="hole">${m.emoji}</span>${esc(m.name)}</div>`;
  }).join('');
  $('#drains').hidden = false;
}
document.addEventListener('pointerdown', (e) => {
  const b = e.target.closest('.buoy[data-n]');
  if (!b) return;
  const r = b.getBoundingClientRect();
  Object.assign(drag, { el: b, n: b.dataset.n, sx: e.clientX, sy: e.clientY, ox: e.clientX - r.left, oy: e.clientY - r.top, active: false, hot: null });
  b.setPointerCapture(e.pointerId);
});
document.addEventListener('pointermove', (e) => {
  if (!drag.el) return;
  const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
  if (!drag.active && Math.hypot(dx, dy) > 8) {
    drag.active = true;
    drag.el.classList.add('is-dragging');
    showDrains();
    haptic.tap();
  }
  if (!drag.active) return;
  const scene = $('#today').getBoundingClientRect();
  drag.el.style.transform = `translate3d(${e.clientX - scene.left - drag.ox}px, ${e.clientY - scene.top - drag.oy}px, 0) scale(1.12) rotate(${clamp(dx * 0.05, -10, 10)}deg)`;
  let best = null, bestD = 64;
  for (const d of $$('.drain')) {
    const r = d.querySelector('.hole').getBoundingClientRect();
    const dist = Math.hypot(e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height / 2));
    if (dist < bestD) { bestD = dist; best = d; }
  }
  if (best !== drag.hot) {
    drag.hot?.classList.remove('hot');
    best?.classList.add('hot');
    drag.hot = best;
    if (best) haptic.pick();
  }
});
function endDrag() {
  if (!drag.el) return;
  const { el, n, hot, active } = drag;
  drag.el = null;
  if (!active) return;
  drag.justDragged = true;
  setTimeout(() => (drag.justDragged = false), 60);
  el.classList.remove('is-dragging');
  $('#drains').hidden = true;
  if (!hot) return;
  const cat = hot.dataset.cat, t = findTx(n);
  el.style.transition = 'opacity .3s';
  el.style.opacity = '0';
  splash(0.5, 32);
  mutate('/api/tx', { n: Number(n), category: cat, month: state.view.month }, () => { haptic.ok(); toast(`${catMeta(cat).emoji} ${catMeta(cat).name}. ${t?.label ?? 'It'} goes there from now on.`); });
}
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);

/* ---------- touch the water ---------- */
const todayEl = $('#today');
todayEl.addEventListener('pointerdown', (e) => {
  if (e.target.closest('button')) return;
  const r = pool.el.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width;
  if (e.clientY - r.top > surfaceY(x) - 30) { pool.wave.poke(x, 14); haptic.soft(); }
});
todayEl.addEventListener('pointermove', (e) => {
  if (e.buttons !== 1 || drag.el) return;
  const r = pool.el.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width;
  if (Math.abs(e.clientY - r.top - surfaceY(x)) < 60) pool.wave.poke(x, e.movementY * 0.5 + 2);
});

document.addEventListener('click', (e) => {
  if (drag.justDragged) return;
  const go = e.target.closest('[data-go]');
  if (go) { haptic.tap(); goTo(go.dataset.go); return; }
  const buoy = e.target.closest('.buoy[data-n]');
  if (buoy) { haptic.tap(); openEditor(buoy.dataset.n); return; }
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  actions[el.dataset.act]?.(el);
});
document.addEventListener('input', (e) => { if (e.target.id === 'cash-amount') updateCashButton(); });
// ⚙ Categories: renaming is saved when you leave the field (or press Enter).
document.addEventListener('change', (e) => {
  const id = e.target.dataset?.catId;
  if (!id) return;
  const name = e.target.value.trim();
  if (!name || name === catMeta(id).name) { e.target.value = catMeta(id).name; return; }
  mutate('/api/category', { rename: id, label: name, month: state.view.month }, () => { haptic.ok(); toast('Renamed'); sheetRedraw(); });
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') sheetBack();
  if (e.key === 'Enter' && e.target.dataset?.catId) e.target.blur(); // saves the rename (change event)
  if (e.key === 'Enter' && e.target.closest?.('.new-cat')) { e.preventDefault(); addCategory(e.target.closest('.new-cat')); } // not the cash form's submit
});

/** ＋ New: what you typed becomes a category ("🎮 Games") and is picked right away. */
function addCategory(box) {
  const name = box.querySelector('input').value.trim(), n = Number(box.dataset.n), to = box.dataset.for;
  if (!name) return;
  haptic.ok();
  if (to === 'settings') {
    mutate('/api/category', { add: name, month: state.view.month }, () => { toast(`${name} added`); sheetRedraw(); });
  } else if (to === 'cash-cat') {
    // Created when the cash entry is saved; until then the name stands in for the picked tile.
    Object.assign(state, { cashNewCat: name, cashCat: null });
    $$('[data-act="cash-cat"]', sheetBody).forEach((b) => b.setAttribute('aria-pressed', 'false'));
    box.outerHTML = `<p class="hint">New category: <b>${esc(name)}</b></p>`;
  } else if (to === 'sort-pick') {
    api('/api/tx', { n, newCategory: name, month: state.view.month }).then(accept).catch((err) => toast(err.message));
    state.sortIndex++;
    sheetBody.innerHTML = sortHTML();
  } else {
    mutate('/api/tx', { n, newCategory: name, month: state.view.month }, () => { toast(`${name} added.`); if (state.sheet === 'edit') openEditor(n); });
  }
}
document.addEventListener('submit', (e) => {
  e.preventDefault();
  if (e.target.id === 'cash-form') {
    const cents = parseEuro($('#cash-amount').value);
    if (!cents) { haptic.err(); $('#cash-error').textContent = 'Enter how much, e.g. 4,50.'; return; }
    const body = { amount: state.cashDir * cents, note: $('#cash-note').value };
    if (state.cashDir < 0 && state.cashNewCat) body.newCategory = state.cashNewCat;
    else if (state.cashDir < 0 && state.cashCat) body.category = state.cashCat;
    mutate('/api/cash', body, () => { haptic.ok(); sheetBack(); toast(`Dropped in ${eur(body.amount, true)}`); splash(0.5, 40); });
  }
  if (e.target.id === 'settings-form') {
    const read = (id) => {
      const raw = $(id).value.replace(/\s/g, '').replace(',', '.');
      if (raw === '') return null;
      const n = Number(raw);
      return Number.isFinite(n) && n >= 0 ? Math.round(n * 100) : NaN;
    };
    const target = $('#set-target').value.trim() === '' ? 20 : Number($('#set-target').value.trim());
    const body = { name: $('#set-name').value, budget: read('#set-budget'), goalAmount: read('#set-goal'), savingsStart: read('#set-start'), goalName: $('#set-goal-name').value, saveTarget: target, month: state.cur.month };
    const capInputs = $$('[data-cap]');
    if (capInputs.length) {
      const caps = Object.fromEntries(capInputs.map((i) => [i.dataset.cap, read(`[data-cap="${i.dataset.cap}"]`)]).filter(([, c]) => c));
      body.caps = Object.keys(caps).length ? caps : null;
    }
    body.loans = $$('[data-loan]').map((i) => ({ name: i.dataset.loan, amount: read(`[data-loan="${CSS.escape(i.dataset.loan)}"]`) ?? 0 }));
    const newName = $('#loan-new-name').value.trim();
    if (newName) body.loans.push({ name: newName, amount: read('#loan-new-amount') ?? 0 });
    const numbers = [body.budget, body.goalAmount, body.savingsStart, ...body.loans.map((l) => l.amount), ...Object.values(body.caps || {})];
    if (numbers.some(Number.isNaN) || !Number.isInteger(target) || target < 0 || target > 90) { haptic.err(); $('#settings-error').textContent = 'Use numbers only, e.g. 600 or 1250,50 (and 0–90 % to keep).'; return; }
    mutate('/api/settings', body, () => { haptic.ok(); sheetBack(); toast('Saved'); splash(0.5, 30); });
  }
});

/* ---------- scroll: the page darkens as you go deeper; animate only what's on screen ---------- */
function onScroll() {
  const max = Math.max(1, root.scrollHeight - innerHeight);
  root.style.setProperty('--d', clamp(scrollY / max, 0, 1).toFixed(3));
}
addEventListener('scroll', () => requestAnimationFrame(onScroll), { passive: true });
const io = new IntersectionObserver((entries) => {
  for (const e of entries) {
    if (e.target.id === 'today') pool.visible = e.isIntersecting;
    if (e.target.id === 'jar-scene') jar.visible = e.isIntersecting;
  }
});
io.observe($('#today'));
io.observe($('#jar-scene'));

function resize() {
  sizeCanvas(pool);
  sizeCanvas(jar);
  if (!jar.fizz.length) jar.fizz = Array.from({ length: 16 }, () => ({ x: 0.15 + Math.random() * 0.7, y: 9999, r: 0.8 + Math.random() * 1.6, sp: 0.3 + Math.random() * 0.6, ph: Math.random() * 6 }));
  measureNum();
}
let resizeTimer;
addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(resize, 120); });

/* ---------- boot ---------- */
if (TG) {
  TG.ready();
  TG.expand();
  try { TG.disableVerticalSwipes?.(); } catch {}
  try { TG.setHeaderColor?.('#060a22'); TG.setBackgroundColor?.('#060a22'); TG.setBottomBarColor?.('#020716'); } catch {}
  TG.BackButton?.onClick(() => (swipe.open ? closeSwiper() : sheetBack()));
  if (TG.isVersionAtLeast?.('8.0') && TG.requestFullscreen) $('#immersive').hidden = false;
}
seedPool();
resize();
startTilt();
onScroll();
requestAnimationFrame(frame);
document.fonts?.ready.then(measureNum);
load();
</script>
</body>
</html>
