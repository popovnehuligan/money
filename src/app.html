<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Money</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Concept: money as water. Today's allowance is a pool; scrolling down goes deeper:
   the month as glasses, where it went, the savings jar, every payment.
   One typeface (Geist) for everything; hierarchy comes from size and weight only.
   One deliberate night-water world, so there is no light variant. */
:root {
  color-scheme: dark;
  --sky-0: #060a22;
  --sky-1: #111b4a;
  --shallow: #0a3266;
  --abyss: #020716;
  --ink: #eaf3ff;
  --ink-2: #a9bbdc;
  --muted: #7085ad;
  --line: rgba(160, 195, 255, .14);
  --glass-2: rgba(170, 210, 255, .08);
  --aqua: #38e8d6;
  --amber: #ffc857;
  --coral: #ff6b5e;
  --gold: #ffd166;
  --gold-deep: #f29e1b;
  --good: #3ee0a1;
  --bad: #ff7076;
  --podmoga: #8f86ff;
  --loan: #6cc4ff;
  --water: 56 232 214;
  --c-taxi: #e8b400; --c-scooter: #2fbf71; --c-food: #3987e5; --c-smokes: #a08c7d; --c-parking: #19b3c4; --c-eat: #e0662e;
  --c-bus: #d9483b; --c-shop: #9085e9; --c-health: #3fae3f; --c-home: #e0598b; --c-other: #7c8bb0;

  --f-ui: "Geist", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --vh: var(--tg-viewport-stable-height, 100svh);
  --top-safe: max(env(safe-area-inset-top, 0px), calc(var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px)));
  --d: 0;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --spring: cubic-bezier(.25, 1.35, .4, 1);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-snap-type: y proximity; -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  color: var(--ink);
  font: 400 15px/1.45 var(--f-ui);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  background: color-mix(in oklab, var(--shallow) calc((1 - var(--d)) * 100%), var(--abyss));
  overflow-x: hidden;
}
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; text-align: inherit; }
input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--aqua); outline-offset: 3px; border-radius: 10px; }
svg { display: block; }
.num-tab { font-variant-numeric: tabular-nums; }

/* ---------- chrome ---------- */
.bar {
  position: fixed; z-index: 8; top: 0; left: 0; right: 0;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding-top: calc(10px + var(--top-safe)); padding-bottom: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.bar::before { content: ""; position: absolute; z-index: -1; inset: 0 0 -28px; background: linear-gradient(180deg, rgba(3, 9, 28, .9) 0%, rgba(3, 9, 28, .7) 55%, rgba(3, 9, 28, 0)); pointer-events: none; }
.bar > * { pointer-events: auto; }
.hello { margin: 0; font: 500 13px/1.25 var(--f-ui); color: var(--ink-2); }
.hello b { display: block; font: 600 16px/1.25 var(--f-ui); color: var(--ink); letter-spacing: -.01em; }
.bar-actions { display: flex; gap: 8px; }
.orb {
  display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%;
  background: rgba(170, 210, 255, .10); box-shadow: inset 0 0 0 1px rgba(170, 210, 255, .18);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  transition: transform .2s var(--spring);
}
.orb:active { transform: scale(.9); }
.orb svg { width: 19px; height: 19px; }


.drop-btn {
  position: fixed; z-index: 9; right: max(22px, calc(env(safe-area-inset-right, 0px) + 14px)); bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  display: grid; width: 60px; height: 60px; border-radius: 50% 50% 50% 8%; transform: rotate(-45deg);
  background: radial-gradient(circle at 35% 30%, #b9fff6 0%, var(--aqua) 38%, #128fb0 100%);
  box-shadow: 0 12px 34px -8px rgba(56, 232, 214, .65), inset 0 -6px 12px rgba(0, 40, 80, .35);
  transition: transform .25s var(--spring);
}
.drop-btn:active { transform: rotate(-45deg) scale(.88); }
.drop-btn svg { width: 26px; height: 26px; transform: rotate(45deg); margin: auto; color: #04203a; }

/* ---------- scenes ---------- */
.scene {
  position: relative; z-index: 1; min-height: var(--vh); scroll-snap-align: start;
  padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px));
  padding-block: calc(84px + var(--top-safe)) 56px;
}
.title { margin: 0; font: 700 30px/1.1 var(--f-ui); letter-spacing: -.035em; text-wrap: balance; }
.head-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.lede { margin: 14px 0 0; max-width: 34ch; color: var(--ink-2); font-size: 15px; }
.lede b { color: var(--ink); font-weight: 600; }

/* today: the pool */
.scene.today { padding: 0; overflow: hidden; min-height: max(var(--vh), 600px); background: linear-gradient(180deg, var(--sky-0) 0%, var(--sky-1) 70%, #1a2c6c 100%); }
#pool { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: pan-y; }
.num-block { position: absolute; z-index: 2; left: 0; right: 0; top: 0; text-align: center; pointer-events: none; padding-inline: 12px; will-change: transform; }
.num-label { margin: 0 0 4px; font: 500 15px/1.2 var(--f-ui); color: var(--ink-2); }
.num-wrap { position: relative; display: inline-block; max-width: 100%; }
.num {
  margin: 0; font-family: var(--f-ui); font-size: clamp(72px, 24vw, 132px); line-height: .95; letter-spacing: -.06em; white-space: nowrap;
  font-weight: var(--wght, 700);
  transition: font-weight 1.4s var(--ease), color .6s;
}
.num .dec { font-size: .32em; letter-spacing: -.02em; font-weight: 600; vertical-align: 1.1em; margin-left: .08em; opacity: .8; }
.num.dry { color: var(--ink); text-shadow: 0 2px 30px rgba(120, 160, 255, .25); }
.num.dry.is-over { color: var(--coral); }
.num.wet { position: absolute; inset: 0; color: color-mix(in oklab, rgb(var(--water)) 40%, white); filter: url(#refract) drop-shadow(0 0 18px rgb(var(--water) / .5)); }
.num-sub { margin: 12px auto 0; max-width: 30ch; font-size: 14px; color: #fff; text-shadow: 0 1px 12px rgba(0, 20, 60, .6); }
.num-sub b { font-weight: 700; }
.buoys { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
.buoy {
  position: absolute; left: 0; top: 0; pointer-events: auto; touch-action: none; will-change: transform;
  display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 12px 0 6px; border-radius: 20px;
  background: linear-gradient(180deg, rgba(40, 62, 130, .75), rgba(14, 26, 70, .8));
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .22), 0 10px 24px -12px rgba(0, 0, 0, .7);
  font: 600 14px var(--f-ui); font-variant-numeric: tabular-nums; white-space: nowrap;
}
.sky-cap { position: absolute; z-index: 2; left: 0; right: 0; top: 0; margin: 0; text-align: center; font: 500 13px var(--f-ui); color: var(--muted); pointer-events: none; will-change: transform; }
.sky-cap b { color: var(--ink-2); font-weight: 600; }
.buoy .e { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: color-mix(in oklab, var(--c, var(--c-other)) 45%, transparent); font: 600 15px var(--f-ui); }
.buoy.is-unsorted { animation: beacon 2.4s infinite; }
.buoy.is-unsorted .e { background: rgba(255, 255, 255, .2); }
@keyframes beacon {
  0%, 60%, 100% { box-shadow: inset 0 0 0 1.5px #fff, 0 0 0 0 rgba(255, 255, 255, .45), 0 8px 20px -10px rgba(0, 0, 0, .6); }
  30% { box-shadow: inset 0 0 0 1.5px #fff, 0 0 0 10px rgba(255, 255, 255, 0), 0 8px 20px -10px rgba(0, 0, 0, .6); }
}
.buoy.is-dragging { z-index: 20; animation: none; box-shadow: inset 0 0 0 1.5px #fff, 0 22px 40px -10px rgba(0, 0, 0, .7); }
.buoy.is-more { font-family: var(--f-ui); padding: 0 14px; }
.deep-info { position: absolute; z-index: 2; left: 0; right: 0; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: 100px; }
.deep-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.tide { position: relative; height: 4px; border-radius: 4px; background: rgba(255, 255, 255, .16); margin-bottom: 10px; }
.tide i { position: absolute; inset: 0 auto 0 0; width: var(--w); border-radius: inherit; background: #fff; }
.tide b { position: absolute; top: -5px; width: 2px; height: 14px; margin-left: -1px; background: var(--gold); border-radius: 2px; box-shadow: 0 0 8px var(--gold); }
.deep-info p { margin: 0; font-size: 13px; color: rgba(234, 243, 255, .85); }
.deep-info p > span { white-space: nowrap; }
.deep-info .ok { color: var(--good); font-weight: 600; }
.deep-info .warn { color: var(--amber); font-weight: 600; }
.dive { flex: none; display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; color: #fff; background: rgba(255, 255, 255, .12); }
.dive svg { width: 16px; height: 16px; animation: bob 2s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(4px); } }
.cta-glass { display: inline-flex; align-items: center; height: 44px; padding: 0 18px; border-radius: 22px; background: #fff; color: #08183e; font-weight: 700; }

/* month: glasses */
.month-nav { display: flex; gap: 8px; }
.month-nav .orb { width: 36px; height: 36px; }
.month-nav .orb:disabled { opacity: .25; cursor: default; }
.stats-line { margin: 8px 0 22px; display: flex; flex-wrap: wrap; gap: 6px 16px; font: 500 14px var(--f-ui); font-variant-numeric: tabular-nums; color: var(--ink-2); }
.stats-line b { color: var(--ink); font-weight: 600; }
.streak { color: var(--gold); }
.glasses { display: grid; grid-template-columns: repeat(7, 1fr); gap: 14px 4px; }
.wd { text-align: center; font: 500 11px var(--f-ui); color: var(--muted); }
.glass { position: relative; display: flex; flex-direction: column; align-items: center; gap: 5px; padding-bottom: 8px; }
.glass .dn { font: 500 11px var(--f-ui); color: var(--ink-2); }
.tube {
  position: relative; width: 24px; height: 64px; border-radius: 3px 3px 12px 12px; overflow: hidden;
  background: linear-gradient(90deg, rgba(170, 210, 255, .10), rgba(170, 210, 255, .03) 60%, rgba(170, 210, 255, .08));
  box-shadow: inset 0 0 0 1.5px rgba(170, 210, 255, .26);
  transition: transform .2s var(--spring);
}
.tube::before { content: ""; position: absolute; z-index: 2; left: 4px; top: 6px; bottom: 10px; width: 2px; border-radius: 2px; background: rgba(255, 255, 255, .22); }
.tube .mark { position: absolute; z-index: 2; left: 0; right: 0; top: 50%; height: 1px; background: rgba(255, 255, 255, .3); }
.liq { position: absolute; left: 0; right: 0; bottom: 0; height: var(--h); display: flex; flex-direction: column-reverse; animation: pour 1.1s var(--ease) both; animation-delay: var(--delay, 0s); }
.liq i { display: block; height: var(--s); background: var(--c); }
.liq::after { content: ""; position: absolute; left: 0; right: 0; top: -2px; height: 4px; border-radius: 50%; background: rgba(255, 255, 255, .45); }
@keyframes pour { from { height: 0; } }
.glass.is-today .tube { box-shadow: inset 0 0 0 1.5px var(--aqua), 0 0 18px rgba(56, 232, 214, .45); }
.glass.is-today .dn { color: var(--aqua); }
.glass.is-future { cursor: default; }
.glass.is-future .tube { opacity: .28; }
.glass .sparkle { position: absolute; bottom: 34px; font-size: 11px; color: var(--gold); text-shadow: 0 0 8px var(--gold); animation: twinkle 2.6s ease-in-out infinite; }
@keyframes twinkle { 50% { opacity: .35; transform: scale(.8); } }
.glass .drip { position: absolute; bottom: 0; width: 6px; height: 8px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; background: var(--coral); animation: drip 1.9s ease-in infinite; }
@keyframes drip { 0% { transform: translateY(-6px) scale(.4); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(14px) scale(1); opacity: 0; } }
.glass:not(:disabled):active .tube { transform: scale(.9); }
.keys { margin-top: 24px; display: flex; flex-wrap: wrap; gap: 8px; }
.key-chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px 0 8px; border-radius: 15px; background: var(--glass-2); font-size: 12px; font-weight: 600; color: var(--ink-2); }
.key-chip i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.legend-note { margin: 14px 0 0; max-width: 46ch; font: 400 13px/1.5 var(--f-ui); color: var(--muted); }

/* where it went */
.totals { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 18px 0 26px; }
.totals div { padding: 12px 12px 13px; border-radius: 18px; background: var(--glass-2); min-width: 0; }
.totals span { display: block; font-size: 13px; color: var(--ink-2); }
.totals b { display: block; margin-top: 2px; font-size: 20px; font-weight: 700; letter-spacing: -.035em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.totals b.gold { color: var(--gold); }
.bars { display: flex; flex-direction: column; gap: 6px; }
.bar-row { display: flex; flex-direction: column; gap: 8px; width: 100%; padding: 8px 0; }
.bar-top { display: flex; justify-content: space-between; gap: 10px; font-size: 15px; font-weight: 600; }
.bar-top span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-top b { font-weight: 600; font-variant-numeric: tabular-nums; }
.meter { height: 8px; border-radius: 99px; background: rgba(255, 255, 255, .07); overflow: hidden; }
.meter i { display: block; height: 100%; width: var(--w); border-radius: inherit; background: var(--c); transform-origin: left; animation: grow .9s var(--ease) both; }
@keyframes grow { from { transform: scaleX(0); } }
.pod { margin-top: 26px; padding: 16px 18px 18px; border-radius: 22px; background: var(--glass-2); }
.pod h3 { margin: 0 0 4px; font: 600 14px var(--f-ui); color: var(--podmoga); }
.pod p { margin: 0; color: var(--ink-2); }
.pod p b { color: var(--good); }
.pod .big-kept { margin: 2px 0 6px; font: 700 30px/1 var(--f-ui); letter-spacing: -.04em; color: var(--good); }
.pod .big-kept.neg { color: var(--coral); }

/* month in review */
.review-btn { display: inline-flex; align-items: center; gap: 8px; height: 40px; margin-top: 14px; padding: 0 16px; border-radius: 20px; background: var(--glass-2); color: var(--ink); font-weight: 600; font-size: 14px; }
.rv-head { margin: 2px 0 0; font: 700 25px/1.15 var(--f-ui); letter-spacing: -.03em; }
.rv-kicker { margin: 0; font: 600 13px var(--f-ui); letter-spacing: .02em; color: var(--aqua); }
.rv-cut { margin-top: 10px; padding: 14px 16px 16px; border-radius: 20px; background: var(--glass-2); }
.rv-cut-top { display: flex; justify-content: space-between; gap: 10px; font-weight: 600; }
.rv-cut-top span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rv-cut-top b { color: var(--good); white-space: nowrap; font-weight: 700; }
.rv-cut p { margin: 6px 0 0; font-size: 14px; line-height: 1.45; color: var(--ink-2); }
.rv-p { margin: 8px 0 0; font-size: 15px; line-height: 1.5; color: var(--ink-2); }
.rv-cut p b, .rv-p b, .rv-note b { color: var(--ink); }
.rv-notes { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 12px; }
.rv-note { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 8px; font-size: 14px; line-height: 1.45; color: var(--ink-2); overflow-wrap: anywhere; }
.rv-plan { margin-top: 28px; padding: 18px 18px 20px; border-radius: 24px; background: linear-gradient(160deg, rgba(56, 232, 214, .2), rgba(143, 134, 255, .16)); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .08); }
.rv-plan h3 { margin: 0; font: 700 19px var(--f-ui); letter-spacing: -.02em; }
.rv-caps { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.rv-caps span { padding: 7px 12px; border-radius: 16px; background: rgba(0, 0, 0, .25); font-weight: 600; font-size: 14px; white-space: nowrap; }
.rv-on { margin: 16px 0 0; padding: 12px 14px; border-radius: 16px; background: rgba(62, 224, 161, .14); color: var(--good); font-weight: 600; font-size: 14px; }
.caps { display: grid; gap: 4px; margin-top: 6px; }
#month .caps { gap: 0; margin: 10px 0 14px; }
#month .caps .bar-row { gap: 5px; padding: 5px 0; }
#month .caps .bar-top { font-size: 14px; }
#month .caps .meter { height: 6px; }
.caps .bar-top b.over { color: var(--coral); }

/* jar */
.jar-stage { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); align-items: center; gap: 10px; margin-top: 18px; }
#jar { width: 100%; aspect-ratio: 220 / 270; max-width: 100%; }
.jar-copy .big { margin: 0; font: 700 clamp(34px, 10vw, 46px)/1 var(--f-ui); letter-spacing: -.05em; white-space: nowrap; color: var(--gold); }
.jar-copy .big .dec { font-size: .45em; letter-spacing: -.02em; opacity: .8; }
.jar-copy p { margin: 6px 0 0; color: var(--ink-2); font-size: 14px; }
.jar-copy p b { color: var(--ink); }
.jar-copy .eta { margin-top: 14px; padding: 12px 14px; border-radius: 16px; background: var(--glass-2); color: var(--ink); font-size: 14px; }
.jar-copy .eta b { color: var(--gold); }
.jar-copy .cta-glass { margin-top: 14px; }
.chip-gold { display: inline-block; margin-top: 10px; padding: 4px 10px; border-radius: 12px; background: rgba(255, 209, 102, .14); color: var(--gold); font: 600 13px var(--f-ui); }
.leaks { position: relative; margin-top: 30px; padding: 18px; border-radius: 22px; background: var(--glass-2); overflow: hidden; }
.leaks h3 { margin: 0; font: 600 14px var(--f-ui); color: var(--bad); }
.leaks .amt { margin: 4px 0; font: 700 32px/1 var(--f-ui); letter-spacing: -.04em; }
.leaks p { margin: 0; color: var(--ink-2); font-size: 14px; max-width: 30ch; }
.leaks p b { color: var(--ink); }
.debts { margin-top: 30px; padding: 18px; border-radius: 22px; background: var(--glass-2); }
.debts h3 { margin: 0; font: 600 14px var(--f-ui); color: var(--loan); }
.debt + .debt { margin-top: 18px; }
.debt .amt { margin: 4px 0; font: 700 32px/1 var(--f-ui); letter-spacing: -.04em; }
.debt p { margin: 0; color: var(--ink-2); font-size: 14px; }
.debt p b { color: var(--ink); }
.split { display: flex; gap: 3px; height: 8px; margin-top: 14px; }
.split i { display: block; height: 100%; border-radius: 4px; width: var(--w); background: var(--c); }
.split-key { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px 14px; font: 500 13px var(--f-ui); font-variant-numeric: tabular-nums; color: var(--ink-2); }
.leak-drops { position: absolute; right: 26px; top: 0; bottom: 0; width: 40px; pointer-events: none; }
.leak-drops i { position: absolute; top: 0; width: 7px; height: 10px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; background: var(--bad); opacity: 0; animation: leak 2.8s ease-in infinite; }
@keyframes leak { 0% { transform: translateY(0) scale(.3); opacity: 0; } 15% { opacity: .9; } 100% { transform: translateY(150px) scale(1); opacity: 0; } }

/* ledger */
.filters { display: flex; gap: 8px; overflow-x: auto; margin: 18px -18px 8px; padding: 2px 18px 6px; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.filter { flex: none; height: 34px; padding: 0 14px; border-radius: 17px; background: var(--glass-2); font-size: 13px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.filter[aria-pressed="true"] { background: var(--ink); color: #071433; }
.day-head { display: flex; justify-content: space-between; padding: 20px 0 6px; font: 600 13px var(--f-ui); font-variant-numeric: tabular-nums; color: var(--muted); }
.row { display: flex; align-items: center; gap: 14px; width: 100%; padding: 9px 0; border-radius: 14px; transition: background .2s; }
.row:active { background: var(--glass-2); }
.drop { flex: none; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50% 50% 50% 12%; transform: rotate(-45deg); background: color-mix(in oklab, var(--c) 30%, transparent); box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--c) 70%, transparent); }
.drop > span { transform: rotate(45deg); font: 600 17px/1 var(--f-ui); }
.row.is-unsorted .drop { background: rgba(255, 255, 255, .12); box-shadow: inset 0 0 0 1.5px #fff; animation: glow 2.4s infinite; }
@keyframes glow { 50% { box-shadow: inset 0 0 0 1.5px #fff, 0 0 14px rgba(255, 255, 255, .45); } }
.row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.row-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-sub { font: 400 13px var(--f-ui); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- drag targets ---------- */

/* ---------- sheet ---------- */
.backdrop { position: fixed; inset: 0; z-index: 20; background: rgba(1, 4, 14, .55); opacity: 0; transition: opacity .3s; }
.backdrop.open { opacity: 1; }
.sheet {
  position: fixed; z-index: 21; left: 0; right: 0; bottom: 0; max-width: 620px; margin: 0 auto; max-height: 88%;
  display: flex; flex-direction: column; border-radius: 30px 30px 0 0;
  background: linear-gradient(180deg, rgba(22, 40, 92, .88), rgba(8, 18, 48, .95));

  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .16), 0 -30px 60px -20px rgba(0, 0, 0, .7);

}
.sheet.open { transform: translateY(0); }
.grabber { flex: none; padding: 10px 0 6px; touch-action: none; cursor: grab; }
.grabber::before { content: ""; display: block; width: 42px; height: 5px; margin: 0 auto; border-radius: 9px; background: rgba(255, 255, 255, .25); }
.sheet-body {
  overflow-y: auto; overscroll-behavior: contain;
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px));
  padding-block: 6px calc(24px + env(safe-area-inset-bottom, 0px));
}
.sh-head { display: flex; align-items: center; gap: 14px; }
.sh-head .drop { width: 50px; height: 50px; }
.sh-head .drop > span { font-size: 22px; }
.sh-title { min-width: 0; }

.sh-title p { margin: 3px 0 0; font: 400 13px var(--f-ui); color: var(--muted); }
.sh-amount { margin: 16px 0 2px; font: 700 48px/1 var(--f-ui); letter-spacing: -.055em; }
.sh-amount.in { color: var(--good); }
.sh-amount .dec { font-size: .4em; letter-spacing: -.01em; opacity: .7; margin-left: .06em; }
.label { margin: 20px 0 9px; font: 600 14px var(--f-ui); color: var(--ink-2); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; border-radius: 18px; background: rgba(0, 0, 0, .25); }
.seg.kinds { grid-auto-flow: row; grid-template-columns: repeat(3, 1fr); }
.seg.halves { grid-auto-flow: row; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.seg.halves button { overflow: hidden; text-overflow: ellipsis; padding-inline: 8px; }
.nowrap { white-space: nowrap; }
.seg button { padding: 10px 2px; border-radius: 14px; font-size: 13px; font-weight: 600; text-align: center; color: var(--ink-2); white-space: nowrap; transition: background .2s, color .2s, transform .15s; }
.seg button[aria-checked="true"] { background: rgba(255, 255, 255, .14); color: #fff; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .18); }
.seg button:active { transform: scale(.95); }
.hint { margin: 9px 2px 0; font-size: 13px; color: var(--ink-2); }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.tile {
  display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 2px 10px; border-radius: 18px;
  background: color-mix(in oklab, var(--c) 16%, rgba(0, 0, 0, .2)); font-size: 11.5px; font-weight: 600; text-align: center; color: var(--ink-2);
  transition: transform .18s var(--spring), box-shadow .2s, background .2s;
}
.tile .em { font-size: 23px; line-height: 1; }
.tile-new { --c: rgba(255, 255, 255, .5); box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .16); }
.details { margin-top: 12px; padding: 14px; border-radius: 18px; background: rgba(0, 0, 0, .2); }

.sh-sub { margin: 28px 0 4px; font: 700 17px var(--f-ui); letter-spacing: -.02em; }
.cat-list { display: grid; gap: 8px; margin-top: 12px; }
.cat-row { display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 8px; }
.cat-row .em { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 14px; font-size: 20px; background: color-mix(in oklab, var(--c) 22%, rgba(0, 0, 0, .2)); }
.cat-row .input { height: 44px; }

.edit-row .who { min-width: 0; font-weight: 600; }
.edit-row .who small { display: block; font-weight: 500; font-size: 12px; color: var(--muted); }

.new-cat button { padding: 0 18px; border-radius: 14px; background: rgba(255, 255, 255, .14); color: #fff; font-weight: 600; }
.tile:active { transform: scale(.9); }
.tile[aria-pressed="true"] { background: color-mix(in oklab, var(--c) 34%, rgba(0, 0, 0, .1)); box-shadow: inset 0 0 0 2px var(--c), 0 0 22px -4px var(--c); color: #fff; }
.worth { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }

.worth button { gap: 6px; padding: 0 6px; font-size: 14px; white-space: nowrap; }

/* earnings: where the money came from */
.totals > button { padding: 12px 12px 13px; border-radius: 18px; background: var(--glass-2); min-width: 0; text-align: left; box-shadow: inset 0 0 0 1px rgba(62, 224, 161, .22); transition: transform .18s var(--spring); }
.totals > button:active { transform: scale(.96); }
.totals > button span { display: block; font-size: 13px; color: var(--ink-2); }
.totals > button b { display: block; margin-top: 2px; font-size: 20px; font-weight: 700; letter-spacing: -.035em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.totals > button span::after { content: " ›"; color: var(--good); }
.donut { position: relative; width: min(232px, 66vw); margin: 14px auto 0; }
.donut svg { display: block; width: 100%; height: auto; overflow: visible; }
.donut .slice { cursor: pointer; transition: opacity .2s; }
.donut.focus .slice:not(.on) { opacity: .3; }
.donut-mid { position: absolute; inset: 22%; display: grid; place-content: center; text-align: center; pointer-events: none; }
.donut-mid b { font: 700 clamp(22px, 7vw, 28px)/1.05 var(--f-ui); letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.donut-mid span { display: block; margin-top: 5px; font-size: 12px; line-height: 1.3; color: var(--ink-2); overflow-wrap: anywhere; }
.earn-list { margin-top: 18px; }
.earn-row { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto 10px; gap: 10px; align-items: center; width: 100%; padding: 11px 2px; text-align: left; border-bottom: 1px solid var(--line); }
.earn-row > i { width: 12px; height: 12px; border-radius: 4px; background: var(--c); }
.earn-row .nm { min-width: 0; }
.earn-row .nm b, .earn-row .am b { display: block; font-weight: 600; }
.earn-row .nm b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.earn-row .nm span, .earn-row .am span { display: block; font-size: 13px; color: var(--ink-2); }
.earn-row .am { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.earn-row .go { color: var(--muted); }

/* rate by swiping */
.rate-orb { position: relative; }
.rate-orb .badge { position: absolute; top: -3px; right: -3px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--coral); color: #fff; font: 700 11px/18px var(--f-ui); text-align: center; }
.swiper {
  position: fixed; inset: 0; z-index: 25; display: flex; flex-direction: column;
  padding: calc(12px + var(--top-safe)) max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: radial-gradient(120% 70% at 50% 0%, #15275e 0%, #081433 60%, var(--abyss) 100%);
  opacity: 0; transition: opacity .28s var(--ease); touch-action: none; overscroll-behavior: contain;
}
.swiper.open { opacity: 1; }
.sw-top { display: grid; grid-template-columns: 40px minmax(0, 1fr) 40px; align-items: center; gap: 8px; }
.sw-title { text-align: center; min-width: 0; }
.sw-title h2 { margin: 0; font: 700 17px var(--f-ui); letter-spacing: -.01em; }
.sw-title p { margin: 2px 0 0; font-size: 13px; color: var(--ink-2); }
.sw-deck { position: relative; flex: 1; min-height: 0; margin: 16px 0 10px; }
.sw-card {
  position: absolute; inset: 0; margin: auto; width: min(100%, 380px); height: min(100%, 540px);
  border-radius: 30px; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab;
  background: linear-gradient(180deg, #1a2f6b 0%, #0d1d4b 100%);
  box-shadow: 0 30px 60px -24px rgba(0, 0, 0, .7), inset 0 0 0 1px rgba(255, 255, 255, .09);
  transition: transform .4s var(--spring), opacity .3s; will-change: transform;
}
.sw-card.next { transform: translateY(16px) scale(.94); opacity: .75; pointer-events: none; }
.sw-card canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.sw-info { position: relative; z-index: 2; padding: 22px 22px 0; pointer-events: none; }
.sw-cat { display: inline-flex; align-items: center; gap: 7px; max-width: 100%; height: 34px; padding: 0 13px; border-radius: 17px; background: rgba(0, 0, 0, .3); font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sw-cat i { width: 9px; height: 9px; flex: none; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px var(--c); }
.sw-name { margin: 16px 0 0; font: 700 25px/1.15 var(--f-ui); letter-spacing: -.025em; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.sw-when { margin: 8px 0 0; color: var(--ink-2); font-size: 15px; font-variant-numeric: tabular-nums; }
.sw-amt { position: absolute; z-index: 2; left: 22px; right: 22px; bottom: 20px; margin: 0; font: 700 clamp(46px, 15vw, 66px)/1 var(--f-ui); letter-spacing: -.05em; color: #fff; text-shadow: 0 2px 24px rgba(0, 0, 0, .35); pointer-events: none; }
.sw-amt .dec { font-size: .4em; letter-spacing: -.01em; opacity: .85; margin-left: .04em; }
.sw-stamp { position: absolute; z-index: 3; top: 24px; padding: 6px 14px; border: 3px solid currentColor; border-radius: 14px; font: 800 21px var(--f-ui); letter-spacing: .05em; text-transform: uppercase; opacity: 0; pointer-events: none; background: rgba(4, 12, 36, .35); }
.sw-stamp.yes { left: 18px; color: var(--good); transform: rotate(-12deg); }
.sw-stamp.no { right: 18px; color: var(--bad); transform: rotate(12deg); }
.sw-stamp.need { left: 50%; top: 42%; color: var(--loan); transform: translateX(-50%) rotate(-5deg); }
.sw-card.rise { animation: sw-rise .3s var(--ease) backwards; }
.sw-card.enter-left { animation: sw-from-left .45s var(--spring) backwards; }
.sw-card.enter-right { animation: sw-from-right .45s var(--spring) backwards; }
.sw-card.enter-up { animation: sw-from-up .45s var(--spring) backwards; }
@keyframes sw-rise { from { transform: translateY(16px) scale(.94); } }
@keyframes sw-from-left { from { transform: translateX(-120vw) rotate(-18deg); } }

.sw-hints { display: flex; justify-content: space-between; margin: 0 auto 12px; width: min(100%, 380px); font: 600 12px var(--f-ui); color: var(--muted); }
.sw-actions { display: flex; justify-content: center; align-items: center; gap: 16px; }

.sw-btn:active { transform: scale(.88); }
.sw-btn.no { box-shadow: inset 0 0 0 2px var(--bad); }
.sw-btn.yes { box-shadow: inset 0 0 0 2px var(--good); }
.sw-btn.need { width: 54px; height: 54px; font-size: 22px; box-shadow: inset 0 0 0 2px var(--loan); }
.sw-btn.back { width: 46px; height: 46px; color: var(--ink-2); }

.sw-btn:disabled { opacity: .3; }
.sw-done { position: absolute; inset: 0; display: grid; place-content: center; gap: 10px; text-align: center; padding: 0 10px; }
.sw-done h2 { margin: 0; font: 700 26px var(--f-ui); letter-spacing: -.03em; }
.sw-done p { margin: 0 auto; max-width: 32ch; color: var(--ink-2); line-height: 1.5; }

.sh-foot { display: flex; justify-content: center; margin-top: 16px; }
.textbtn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 4px; font-weight: 600; font-size: 14px; color: var(--ink-2); }

.input:focus, .suffix:focus-within { box-shadow: inset 0 0 0 2px var(--aqua); }

.amount-field input { width: 5.2ch; max-width: 72%; border: 0; background: none; outline: none; text-align: right; font: 700 56px/1 var(--f-ui); letter-spacing: -.05em; caret-color: var(--aqua); }

.sort-card { margin: 16px 0 4px; padding: 16px; border-radius: 22px; background: rgba(255, 255, 255, .07); display: flex; align-items: center; gap: 14px; animation: card-in .4s var(--spring) both; }
@keyframes card-in { from { transform: translateX(30px) scale(.96); opacity: 0; } }
.sort-card .row-amt { font-size: 20px; }
.done { text-align: center; padding: 20px 0 6px; }
.done-art { font-size: 56px; animation: pop .7s var(--spring) both; }
@keyframes pop { from { transform: scale(.2); opacity: 0; } }
.done h2 { margin: 10px 0 4px; font: 700 28px var(--f-ui); letter-spacing: -.035em; }

.toast {
  position: fixed; z-index: 30; left: 50%; top: calc(64px + var(--top-safe)); max-width: calc(100% - 32px);
  transform: translate(-50%, -16px); opacity: 0; pointer-events: none;

@media (prefers-reduced-motion: reduce) {

}

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="refract"><feTurbulence type="fractalNoise" baseFrequency="0.012 0.06" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G"/></filter>
</svg>

<header class="bar">
  <p class="hello" id="hello">Money<b>Your pool</b></p>
  <div class="bar-actions">
    <button class="orb" id="immersive" data-act="immersive" aria-label="Full screen" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <button class="orb rate-orb" data-act="rate" aria-label="Rate payments"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="3" width="12" height="16" rx="3" transform="rotate(10 13 11)"/><path d="M5.5 7.5 4.6 18a3 3 0 0 0 2.7 3.2l7.2.6"/></svg><span class="badge" id="rate-badge" hidden></span></button>
    <button class="orb" data-act="settings" aria-label="Budget and savings goal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg></button>
  </div>
</header>


<main>
  <section class="scene today" id="today" aria-label="Today">
    <canvas id="pool" aria-hidden="true"></canvas>
    <div class="num-block" id="num-block">
      <p class="num-label" id="num-label">Safe to spend today</p>
      <div class="num-wrap" id="num-wrap"><p class="num dry" id="num-dry">&nbsp;</p><p class="num wet" id="num-wet" aria-hidden="true">&nbsp;</p></div>
      <p class="num-sub" id="num-sub">Filling the pool…</p>
    </div>
    <p class="sky-cap" id="sky-cap" hidden></p>
    <div class="buoys" id="buoys"></div>

<script>
'use strict';
const TG = window.Telegram && window.Telegram.WebApp;
const tg = TG && TG.initData ? TG : null; // null outside Telegram
const root = document.documentElement;
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------- formatting ---------- */
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const NUM = new Intl.NumberFormat('sk-SK', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const NUM0 = new Intl.NumberFormat('sk-SK', { maximumFractionDigits: 0 });
const sign = (c, signed) => (c < 0 ? '−' : signed && c > 0 ? '+' : '');
const eur = (c, signed) => sign(c, signed) + NUM.format(Math.abs(c) / 100) + ' €';
const eur0 = (c, signed) => sign(c, signed) + NUM0.format(Math.round(Math.abs(c) / 100)) + ' €';
const eurExact = (c) => (c % 100 ? eur(c) : eur0(c)); // loans: keep the cents you owe
const short = (c, signed) => sign(c, signed) + NUM.format(Math.abs(c) / 100);
function money(c, signed) {
  const [int, dec] = NUM.format(Math.abs(c) / 100).split(',');
  return `${sign(c, signed)}${int}<span class="dec">,${dec} €</span>`;
}
/** "4,50" or "4.50" -> 450 cents; null when it isn't a positive amount. */
const parseEuro = (s) => {
  const n = Number(String(s).replace(/\s/g, '').replace(',', '.'));
  return Number.isFinite(n) && n > 0 ? Math.round(n * 100) : null;
};
const WD = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MONTH = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const asDate = (day) => new Date(day + 'T12:00:00Z');
const wdIndex = (day) => (asDate(day).getUTCDay() + 6) % 7;
const addDays = (day, n) => { const d = asDate(day); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const shiftMonth = (m, n) => { const [y, mo] = m.split('-').map(Number); return new Date(Date.UTC(y, mo - 1 + n, 1)).toISOString().slice(0, 7); };
const shortDay = (day) => `${WD[wdIndex(day)]} ${+day.slice(8)} ${MON[+day.slice(5, 7) - 1]}`;
const dayLabel = (day, today) => (day === today ? 'Today' : day === addDays(today, -1) ? 'Yesterday' : shortDay(day));

/* ---------- colors ---------- */
const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const AQUA = [56, 232, 214], AMBER = [255, 200, 87], CORAL = [255, 107, 94], DEEP = [8, 30, 78];
const GOLD = [255, 209, 102], GOLD_DEEP = [242, 158, 27];
/** The pool cools down to aqua when there's plenty left and heats up as it runs out. */
function waterFor(f, over) {
  if (over) return CORAL;
  if (f >= 0.45) return AQUA;
  if (f >= 0.18) return mix(AMBER, AQUA, (f - 0.18) / 0.27);
  return mix(CORAL, AMBER, f / 0.18);
}
const cssVar = (name) => getComputedStyle(root).getPropertyValue(name).trim();

/* ---------- icons ---------- */
const svg = (d) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ICON = {
  left: svg('<path d="m15 18-6-6 6-6"/>'),
  right: svg('<path d="m9 18 6-6-6-6"/>'),
  down: svg('<path d="M12 5v14M6 13l6 6 6-6"/>'),
  trash: svg('<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>'),
};

/* ---------- vocabulary ---------- */
const KIND = {
  spend: { icon: '💸', name: 'Spend', c: 'var(--c-other)', hint: 'Counts as spending. Pick a category; next time this place is sorted for you.' },
  income: { icon: '💰', name: 'Income', c: 'var(--good)', hint: 'Counts as income.' },
  podmoga: { icon: '🔁', name: 'Passed on', c: 'var(--podmoga)', hint: 'Money you only pass on: podmoga jobs, or someone’s money for a bill. Only what you keep, in minus out, counts.' },
  loan: { icon: '🤝', name: 'Loan', c: 'var(--loan)', hint: 'Borrowed or paid back. Not income or spending: it changes what you owe.' },
  savings: { icon: '🫙', name: 'Savings', c: 'var(--gold)', hint: 'Moved to or from savings. Shown in the jar, never as spending.' },
  cash: { icon: '💵', name: 'Cash', c: 'var(--ink-2)', hint: 'Cash out of an ATM, or cash paid in. Not spending: what you spend from it counts when you add it as cash.' },
  ignore: { icon: '🚫', name: 'Ignore', c: 'var(--muted)', hint: 'Not counted anywhere, e.g. moves between your own accounts.' },
};
const UNCOUNTED = new Set(['ignore', 'cash', 'podmoga']); // shown, but their own amounts aren't part of any total (passed-on money counts only as its net)
let CATS = {};
// Built-in categories have a colour token; ones you typed take the next colour from this palette.
const BUILT_IN = new Set(['taxi', 'scooter', 'food', 'smokes', 'parking', 'eat', 'bus', 'shop', 'health', 'home', 'other']);
const OWN_COLORS = ['#f5a524', '#8b7cf6', '#22b8cf', '#f0568c', '#9bc53d', '#e07a5f', '#5c7cfa', '#2fbf71'];
const catMeta = (id) => {
  const known = id in CATS;
  const label = CATS[known ? id : 'other'] || '📦 Other';
  const i = label.indexOf(' ');
  const mine = Object.keys(CATS).filter((k) => !BUILT_IN.has(k));
  const c = !known ? 'var(--c-other)' : BUILT_IN.has(id) ? `var(--c-${id})` : OWN_COLORS[mine.indexOf(id) % OWN_COLORS.length];
  return { id, emoji: label.slice(0, i), name: label.slice(i + 1), c };
};
const visual = (t) => (t.kind === 'spend' ? (t.category ? { icon: catMeta(t.category).emoji, c: catMeta(t.category).c } : { icon: '💸', c: 'var(--c-other)' }) : { icon: KIND[t.kind].icon, c: KIND[t.kind].c });
const isUnsorted = (t) => t.kind === 'spend' && !t.category && t.amount < 0;
/** What a payment cost as spending: half a bar bill that paid a loan back costs half. */
const own = (t) => t.amount - (t.loanPart || 0);

/* ---------- Telegram glue ---------- */
const haptic = {
  tap() { tg?.HapticFeedback?.impactOccurred('light'); },
  soft() { tg?.HapticFeedback?.impactOccurred('soft'); },
  pick() { tg?.HapticFeedback?.selectionChanged(); },
  ok() { tg?.HapticFeedback?.notificationOccurred('success'); },
  err() { tg?.HapticFeedback?.notificationOccurred('error'); },
};

async function api(path, body) {
  const res = await fetch(path, {
    method: body ? 'POST' : 'GET',
    headers: { 'x-init-data': TG?.initData || '', ...(body ? { 'content-type': 'application/json' } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Couldn’t reach the server. Check your connection and try again.');
  return data;
}

/* ---------- state ---------- */
// cur: this month, which drives the pool. view: the month shown in the deeper scenes.
const state = { cur: null, view: null, filter: 'all', sheet: null, months: {} }; // months: every month loaded, by "YYYY-MM"

function dailyOf(d) {
  const days = Array.from({ length: d.days + 1 }, () => ({ spent: 0, count: 0, cats: {} }));
  for (const t of d.tx) {
    if (t.kind !== 'spend') continue;
    const day = days[+t.ts.slice(8, 10)];
    day.spent -= own(t);
    if (t.amount < 0) day.count++;
    const c = t.category || 'other';
    day.cats[c] = (day.cats[c] || 0) - own(t);
  }
  return days;
}

/* =========================================================================
   Water: a row of springs. Cheap, stable and lively enough to touch.
   ========================================================================= */
class Wave {
  constructor(n) {
    this.n = n;
    this.h = new Float32Array(n); this.v = new Float32Array(n);
    this.l = new Float32Array(n); this.r = new Float32Array(n);
    this.tilt = 0; this.t = 0; this.calm = reduceMotion ? 0 : 1;
  }
  poke(x01, force) {
    const i = Math.round(clamp(x01, 0, 1) * (this.n - 1));
    for (let k = -3; k <= 3; k++) { const j = i + k; if (j >= 0 && j < this.n) this.v[j] += force * (1 - Math.abs(k) / 4); }
  }
  step() {
    const { n, h, v, l, r } = this;
    this.t += 1 / 60;
    for (let i = 0; i < n; i++) {
      const rest = this.tilt * (i / (n - 1) - 0.5);
      v[i] += (rest - h[i]) * 0.02;
      v[i] *= 0.982;
      h[i] += v[i];
    }
    for (let pass = 0; pass < 3; pass++) {
      for (let i = 0; i < n; i++) {
        l[i] = i > 0 ? 0.22 * (h[i] - h[i - 1]) : 0;
        r[i] = i < n - 1 ? 0.22 * (h[i] - h[i + 1]) : 0;
        if (i > 0) v[i - 1] += l[i];
        if (i < n - 1) v[i + 1] += r[i];
      }
      for (let i = 0; i < n; i++) { if (i > 0) h[i - 1] += l[i]; if (i < n - 1) h[i + 1] += r[i]; }
    }
  }
  /** Surface displacement in px at x (0..1); positive is lower. */
  at(x) {
    const f = clamp(x, 0, 1) * (this.n - 1), i = Math.min(this.n - 2, Math.floor(f)), u = f - i;
    const base = this.h[i] * (1 - u) + this.h[i + 1] * u;
    return base + this.calm * (Math.sin(x * 7 + this.t * 1.3) * 3.4 + Math.sin(x * 15 - this.t * 2.2) * 1.5);
  }
}

const pool = {
  el: $('#pool'), ctx: null, w: 0, h: 0, wave: new Wave(90),
  level: 0.7, levelTarget: 0.7, color: AQUA.slice(), colorTarget: AQUA.slice(),
  bubbles: [], visible: true,
};
pool.ctx = pool.el.getContext('2d');
// Full pool: the surface sits 36% down the screen. Empty: 74%. The sky above is what's been spent.
const baseY = () => pool.h * (0.36 + (1 - pool.level) * 0.38);
const surfaceY = (x01) => baseY() + pool.wave.at(x01);

function sizeCanvas(c) {
  const dpr = Math.min(2, devicePixelRatio || 1);
  const w = c.el.clientWidth, h = c.el.clientHeight;
  c.el.width = Math.round(w * dpr); c.el.height = Math.round(h * dpr);
  c.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.w = w; c.h = h;
}

function seedPool() {
  let s = 11;
  const rnd = () => ((s = (s * 16807) % 2147483647) / 2147483647);
  pool.bubbles = Array.from({ length: 14 }, () => ({ x: rnd(), y: 0.6 + rnd() * 0.4, r: 1 + rnd() * 3, sp: 0.15 + rnd() * 0.5, ph: rnd() * 6 }));
}

function drawPool(now) {
  const { ctx: c, w: W, h: H, wave } = pool;
  if (!W) return;
  pool.level += (pool.levelTarget - pool.level) * 0.03;
  pool.color = mix(pool.color, pool.colorTarget, 0.04);
  const col = pool.color, t = now / 1000;
  c.clearRect(0, 0, W, H);


  const SEG = 72, pts = [];
  for (let k = 0; k <= SEG; k++) pts.push([(k / SEG) * W, surfaceY(k / SEG)]);
  const base = baseY();

  // a back swell, for depth
  c.beginPath();
  c.moveTo(0, H);
  for (let k = 0; k <= SEG; k++) {
    const x = k / SEG;
    c.lineTo(x * W, base - 12 + wave.calm * Math.sin(x * 5 - t * 0.8) * 6 + wave.h[Math.round(x * (wave.n - 1))] * 0.4);
  }
  c.lineTo(W, H); c.closePath();
  c.fillStyle = rgba(col, 0.22);
  c.fill();

  const body = new Path2D();
  body.moveTo(0, H);
  for (const [x, y] of pts) body.lineTo(x, y);
  body.lineTo(W, H); body.closePath();
  const g = c.createLinearGradient(0, base - 24, 0, H);
  g.addColorStop(0, rgba(col, 0.92));
  g.addColorStop(0.16, rgba(mix(col, DEEP, 0.5), 0.97));
  g.addColorStop(0.55, rgba(mix(col, DEEP, 0.82), 1));
  g.addColorStop(1, rgba(DEEP, 1));
  c.fillStyle = g;
  c.fill(body);

  c.save();
  c.clip(body);
  c.globalCompositeOperation = 'lighter';
  for (const b of pool.bubbles) {
    if (!reduceMotion) {
      b.y -= (b.sp / H) * 1.6;
      if (b.y * H < surfaceY(b.x) + 6) { b.y = 1.02; b.x = Math.random(); }
    }
    c.strokeStyle = 'rgba(255,255,255,.35)';
    c.beginPath(); c.arc(b.x * W + Math.sin(t * 2 + b.ph) * 4, b.y * H, b.r, 0, Math.PI * 2); c.stroke();
  }
  c.restore();

  c.save();
  c.shadowColor = rgba(col, 0.95);
  c.shadowBlur = 16;
  c.strokeStyle = 'rgba(255,255,255,.88)';
  c.lineWidth = 1.6;
  c.beginPath();
  pts.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y)));
  c.stroke();
  c.restore();
}

/* The number floats on the pool, two-thirds above the surface; the part below is drawn "wet". */
const num = { block: $('#num-block'), wrap: $('#num-wrap'), dry: $('#num-dry'), wet: $('#num-wet'), m: null, box: null, top: 0 };
function measureNum() {
  const w = num.wrap;
  num.m = { x: w.offsetLeft, y: w.offsetTop, w: w.offsetWidth, h: w.offsetHeight };
}
function floatNum() {
  const m = num.m;
  if (!m || !pool.w) return;
  num.top = baseY() + pool.wave.at(0.5) * 0.7 - (m.y + m.h * 0.66);
  num.block.style.transform = `translate3d(0, ${num.top.toFixed(1)}px, 0)`;
  num.box = { x: m.x, y: num.top + m.y, w: m.w, h: m.h };
}
function clipNum() {
  const b = num.box;
  if (!b || !pool.w || !b.w) return;
  // The polygons reach 60px past the text box so its glow isn't cut into a rectangle.
  const P = 60, edge = [];
  for (let k = 0; k <= 16; k++) {
    const y = clamp(surfaceY((b.x + (b.w * k) / 16) / pool.w) - b.y, -P, b.h + P);
    const x = k === 0 ? `${-P}px` : k === 16 ? `calc(100% + ${P}px)` : `${((100 * k) / 16).toFixed(1)}%`;
    edge.push(`${x} ${y.toFixed(1)}px`);
  }
  num.dry.style.clipPath = `polygon(${-P}px ${-P}px, calc(100% + ${P}px) ${-P}px, ${edge.slice().reverse().join(', ')})`;
  num.wet.style.clipPath = `polygon(${edge.join(', ')}, calc(100% + ${P}px) calc(100% + ${P}px), ${-P}px calc(100% + ${P}px))`;
}

/* Today's payments hang in the sky as drops: water that has left the pool. */
const buoys = { list: [] };
function placeBuoys(now) {
  const n = buoys.list.length;
  if (!n) return;
  const t = now / 1000;
  const top = 150, bottom = Math.max(top + 50, num.top + (num.m ? num.m.y : 0) - 30);
  $('#sky-cap').style.transform = `translate3d(0, ${(top + (bottom - top) * 0.3 - 66).toFixed(1)}px, 0)`;
  buoys.list.forEach((b, i) => {
    if (b.el.classList.contains('is-dragging')) return;
    const x = n === 1 ? 0.5 : 0.22 + (0.56 * i) / (n - 1);
    const row = n === 1 ? 0.5 : n === 2 ? (i ? 0.62 : 0.38) : i % 2 ? 0.78 : 0.3;
    const bob = reduceMotion ? 0 : Math.sin(t * 1.1 + i * 1.7) * 5;
    const y = top + (bottom - top) * row - 20 + bob;
    b.el.style.transform = `translate3d(${(x * pool.w - b.el.offsetWidth / 2).toFixed(1)}px, ${y.toFixed(1)}px, 0) rotate(${(reduceMotion ? 0 : Math.sin(t * 0.9 + i) * 3).toFixed(2)}deg)`;
  });
}

/* =========================================================================
   The savings jar: the same water, in gold.
   ========================================================================= */
const jar = { el: $('#jar'), ctx: null, w: 0, h: 0, wave: new Wave(36), level: 0, levelTarget: 0, fizz: [], visible: false };
jar.ctx = jar.el.getContext('2d');
function jarPath(W, H) {
  const p = new Path2D();
  p.moveTo(W * 0.33, H * 0.12); p.lineTo(W * 0.33, H * 0.18);
  p.quadraticCurveTo(W * 0.1, H * 0.2, W * 0.1, H * 0.32);
  p.lineTo(W * 0.1, H * 0.85); p.quadraticCurveTo(W * 0.1, H * 0.97, W * 0.24, H * 0.97);
  p.lineTo(W * 0.76, H * 0.97); p.quadraticCurveTo(W * 0.9, H * 0.97, W * 0.9, H * 0.85);
  p.lineTo(W * 0.9, H * 0.32); p.quadraticCurveTo(W * 0.9, H * 0.2, W * 0.67, H * 0.18);
  p.lineTo(W * 0.67, H * 0.12); p.closePath();
  return p;
}
function drawJar(now) {
  const { ctx: c, w: W, h: H, wave } = jar;
  if (!W) return;
  const t = now / 1000;
  jar.level += (jar.levelTarget - jar.level) * 0.025;
  c.clearRect(0, 0, W, H);
  const shape = jarPath(W, H);
  c.fillStyle = 'rgba(170,210,255,.06)';
  c.fill(shape);
  const top = H * 0.24, bottom = H * 0.97;
  const base = bottom - (bottom - top) * jar.level;
  c.save();
  c.clip(shape);
  if (jar.level > 0.005) {
    const liquid = new Path2D();
    liquid.moveTo(0, H);
    for (let k = 0; k <= 40; k++) liquid.lineTo((k / 40) * W, base + wave.at(k / 40) * 0.6);
    liquid.lineTo(W, H); liquid.closePath();
    const g = c.createLinearGradient(0, base, 0, bottom);
    g.addColorStop(0, rgba(GOLD, 0.95)); g.addColorStop(1, rgba(GOLD_DEEP, 1));
    c.fillStyle = g;
    c.fill(liquid);
    c.save();
    c.clip(liquid);
    for (const f of jar.fizz) {
      if (!reduceMotion) { f.y -= f.sp; if (f.y < base + 4) { f.y = bottom; f.x = 0.15 + Math.random() * 0.7; } }
      c.fillStyle = 'rgba(255,255,255,.5)';
      c.beginPath(); c.arc(f.x * W + Math.sin(t * 3 + f.ph) * 2, f.y, f.r, 0, Math.PI * 2); c.fill();
    }
    c.restore();
    c.strokeStyle = 'rgba(255,255,255,.75)';
    c.lineWidth = 1.4;
    c.beginPath();
    for (let k = 0; k <= 40; k++) c.lineTo((k / 40) * W, base + wave.at(k / 40) * 0.6);
    c.stroke();
  }
  c.restore();
  c.strokeStyle = 'rgba(190,220,255,.45)';
  c.lineWidth = 2;
  c.stroke(shape);
  c.strokeStyle = 'rgba(255,255,255,.28)';
  c.lineWidth = 4; c.lineCap = 'round';
  c.beginPath(); c.moveTo(W * 0.17, H * 0.36); c.lineTo(W * 0.17, H * 0.8); c.stroke();
  c.fillStyle = '#5b66ff';
  c.beginPath(); c.roundRect(W * 0.29, H * 0.04, W * 0.42, H * 0.09, 7); c.fill();
  c.fillStyle = 'rgba(255,255,255,.3)';
  c.fillRect(W * 0.34, H * 0.065, W * 0.32, 3);
}


/* Tilt the phone and the water follows (Telegram 8.0+). */
let tiltTarget = 0;
function startTilt() {
  const acc = TG?.Accelerometer;
  if (!acc || !TG.isVersionAtLeast?.('8.0')) return;
  try {
    acc.start({ refresh_rate: 40 });
    TG.onEvent('accelerometerChanged', () => { tiltTarget = clamp(acc.x * 9, -90, 90); });
  } catch {}
}

let last = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (document.hidden || now - last < 15) return;
  last = now;
  if (swipe.open) { for (const cd of swipe.cards) drawSwipeCard(cd, now); return; }
  pool.wave.tilt += (tiltTarget - pool.wave.tilt) * 0.08;
  jar.wave.tilt = pool.wave.tilt * 0.5;
  if (pool.visible) {
    if (!reduceMotion && Math.random() < 0.012) pool.wave.poke(Math.random(), (Math.random() - 0.5) * 3);
    pool.wave.step();
    drawPool(now);
    floatNum();
    clipNum();
    placeBuoys(now);
  }
  if (jar.visible) { jar.wave.step(); drawJar(now); }
}

function renderToday() {
  const d = state.cur, s = d.summary;
  const label = $('#num-label'), sub = $('#num-sub'), info = $('#deep-info');
  let f, over = false, value;
  if (d.safe) {
    const { allowance, left } = d.safe;
    over = left < 0;
    f = allowance > 0 ? clamp(left / allowance, 0, 1) : 0;
    value = left;
    label.textContent = over ? 'Over today’s allowance' : 'Safe to spend today';
    sub.innerHTML = over ? 'Tomorrow’s pool fills a little lower.' : `of <b>${eur(Math.max(allowance, 0))}</b> for today · ${Math.round(f * 100)} % left`;
  } else if (d.balance) {
    // No budget: the pool is what's really on your account, the number your bank app shows.
    const b = d.balance;
    over = b.amount < 0;
    f = clamp(b.amount / Math.max(b.amount + s.spent, 1), 0, 1);
    value = b.amount;
    label.textContent = 'On your account';
    sub.innerHTML = `as of ${esc(dayLabel(b.ts.slice(0, 10), d.today).toLowerCase())}, ${b.ts.slice(11, 16)} · spent this month&nbsp;<b>${eur(s.spent)}</b><br>Set a monthly budget and this becomes your daily pool.`;
  } else {
    label.textContent = 'Spent this month';
    f = 0.5;
    value = s.spent;
    sub.textContent = 'Set a monthly budget and this becomes your daily pool.';
  }
  num.dry.innerHTML = num.wet.innerHTML = money(value);
  num.dry.classList.toggle('is-over', over);
  // The number gets lighter as the day's water runs out.
  root.style.setProperty('--wght', (over ? 250 : 300 + 500 * f).toFixed(0));
  pool.levelTarget = over ? 0.02 : 0.08 + 0.92 * f;
  pool.colorTarget = waterFor(f, over);
  root.style.setProperty('--water', pool.colorTarget.map((v) => v | 0).join(' '));


  const todays = d.tx.filter((t) => t.ts.startsWith(d.today) && !UNCOUNTED.has(t.kind));
  const shown = todays.slice(0, 5), more = todays.length - shown.length;
  const items = [...shown.map((t) => ({ t })), ...(more > 0 ? [{ more }] : [])];
  const box = $('#buoys');
  box.innerHTML = items.map((it) => {
    if (it.more) return `<button class="buoy is-more" data-go="ledger" aria-label="${it.more} more payments today">+${it.more} more</button>`;
    const t = it.t, v = visual(t), un = isUnsorted(t);
    return `<button class="buoy${un ? ' is-unsorted' : ''}" data-n="${t.n}" style="--c:${v.c}" aria-label="${esc(t.label)}, ${eur(t.amount, true)}${un ? ', needs a category: drag it into one or tap it' : ''}"><span class="e">${un ? '?' : v.icon}</span>${short(t.amount, true)}</button>`;
  }).join('');
  buoys.list = $$('.buoy', box).map((el) => ({ el }));
  const gone = todays.reduce((a, t) => (t.kind === 'spend' ? a - own(t) : a), 0);
  const cap = $('#sky-cap');
  cap.hidden = !todays.length;
  cap.innerHTML = gone > 0 ? `Spent today · <b>${eur(gone)}</b>` : 'Today';
  if (!todays.length && d.safe && !over) sub.innerHTML += '<br>Nothing spent yet today. Clear skies.';

  const dayNum = +d.today.slice(8);
  if (d.budget) {
    const ahead = s.spent - Math.round((d.budget * dayNum) / d.days);
    info.innerHTML = `<div class="tide" role="img" aria-label="${eur0(s.spent)} of ${eur0(d.budget)} spent this month; the gold mark is where today's pace should be"><i style="--w:${Math.min(100, (100 * s.spent) / d.budget).toFixed(1)}%"></i><b style="left:${((100 * dayNum) / d.days).toFixed(1)}%"></b></div>
      <div class="deep-row"><p><span><span class="num-tab">${eur0(s.spent)} / ${eur0(d.budget)}</span> in ${esc(d.name)}</span> · <span>${d.days - dayNum} days left</span> · ${ahead <= 0 ? '<span class="ok">on pace</span>' : `<span class="warn">${eur0(ahead)} over pace</span>`}</p>
      <button class="dive" data-go="month" aria-label="Dive into ${esc(d.name)}">${ICON.down}</button></div>`;
  } else {
    // Early in a month, last month's review (and its challenge) is the way in; later, the budget.
    const last = shiftMonth(d.month, -1);
    const cta = dayNum <= 10 ? `<button class="cta-glass" data-act="review" data-month="${last}">📋 Your ${MONTH[+last.slice(5) - 1]} review</button>` : '<button class="cta-glass" data-act="settings">Set a monthly budget</button>';
    info.innerHTML = `<div class="deep-row">${cta}<button class="dive" data-go="month" aria-label="Dive into ${esc(d.name)}">${ICON.down}</button></div>`;
  }
  requestAnimationFrame(measureNum);
}

function renderMonth() {
  const d = state.view, s = d.summary, daily = dailyOf(d);
  const cap = d.budget ? (2 * d.budget) / d.days : Math.max(1, ...daily.map((x) => x.spent));
  const tracked = d.tx.length ? d.tx[d.tx.length - 1].ts.slice(0, 10) : null;
  const order = Object.keys(CATS);
  const cells = WD.map((w) => `<span class="wd" aria-hidden="true">${w.slice(0, 2)}</span>`);
  for (let i = 0; i < wdIndex(`${d.month}-01`); i++) cells.push('<span aria-hidden="true"></span>');
  for (let n = 1; n <= d.days; n++) {
    const day = `${d.month}-${String(n).padStart(2, '0')}`;
    const x = daily[n], future = day > d.today;
    const dry = !future && x.spent <= 0 && tracked && day >= tracked && day < d.today;
    const over = x.spent > cap;
    const segs = order.filter((c) => x.cats[c] > 0).map((c) => `<i style="--s:${((100 * x.cats[c]) / Math.max(x.spent, 1)).toFixed(1)}%;--c:${catMeta(c).c}"></i>`).join('');
    const cls = ['glass', future ? 'is-future' : '', day === d.today ? 'is-today' : ''].join(' ');
    const label = `${shortDay(day)}: ${future ? 'still ahead' : x.spent > 0 ? `${eur(x.spent)} in ${x.count} payment${x.count === 1 ? '' : 's'}${over ? ', a big day' : ''}` : 'nothing spent'}`;
    cells.push(`<button class="${cls}" data-act="day" data-day="${day}" aria-label="${label}" ${future ? 'disabled' : ''}>
      <span class="dn">${n}</span>
      <span class="tube">${d.budget ? '<span class="mark"></span>' : ''}${x.spent > 0 ? `<span class="liq" style="--h:${(clamp(x.spent / cap, 0, 1) * 100).toFixed(1)}%;--delay:${(n * 0.012).toFixed(3)}s">${segs}</span>` : ''}</span>
      ${dry ? '<span class="sparkle" aria-hidden="true">✦</span>' : ''}${over ? '<span class="drip" aria-hidden="true"></span>' : ''}
    </button>`);
  }
  const keys = s.byCategory.map(([c]) => { const m = catMeta(c); return `<button class="key-chip" data-act="cat" data-cat="${c}" style="--c:${m.c}"><i></i>${esc(m.name)}</button>`; }).join('');
  const year = d.month.slice(0, 4) !== d.today.slice(0, 4) ? ` ${d.month.slice(0, 4)}` : '';
  $('#month').innerHTML = `
    <div class="head-row">
      <h2 class="title" id="month-title">${esc(d.name)}${year}</h2>
      <div class="month-nav">
        <button class="orb" data-act="prev" aria-label="Previous month">${ICON.left}</button>
        <button class="orb" data-act="next" aria-label="Next month" ${d.month >= state.cur.month ? 'disabled' : ''}>${ICON.right}</button>
      </div>
    </div>
    <div class="stats-line"><span><b>${eur0(s.spent)}</b> spent</span>${d.budget ? `<span>of <b>${eur0(d.budget)}</b></span>` : ''}${d.streak ? `<span class="streak">✦ ${d.streak}-day dry streak</span>` : ''}</div>
    <button class="review-btn" data-act="review" data-month="${d.month}">📋 ${esc(d.name)} ${d.current ? 'so far' : 'in review'}</button>
    ${d.challenge ? `<div class="caps">${capsHTML(d.challenge)}</div>` : ''}
    <div class="glasses">${cells.join('')}</div>
    ${keys ? `<div class="keys">${keys}</div>` : ''}
    <p class="legend-note">Each glass is a day${d.budget ? `, full at ${eur0(cap)} (twice your daily budget); the line marks one day’s budget` : ''}. ✦ means nothing spent. A dripping glass was a big day.</p>`;
}

function renderFlow() {
  const d = state.view, s = d.summary;
  const cats = s.byCategory.filter(([, v]) => v > 0);
  const max = cats.length ? cats[0][1] : 1;
  const bars = cats.map(([id, v]) => {
    const m = catMeta(id);
    return `<button class="bar-row" data-act="cat" data-cat="${id}" style="--c:${m.c}">
      <span class="bar-top"><span>${m.emoji} ${esc(m.name)}</span><b>${eur0(v)}</b></span>
      <span class="meter"><i style="--w:${((100 * v) / max).toFixed(1)}%"></i></span>
    </button>`;
  }).join('');
  let pod = '';
  const po = d.passedOn;
  if (po.in || po.out) {
    // Someone else's money through your account: never income or spending. Only what you keep counts, as a running total.
    const month = s.podmogaNet > 0 ? `${eur0(s.podmogaNet)} of it is in ${esc(d.name)}’s earnings.`
      : s.overdraft > 0 ? `In ${esc(d.name)} you passed on ${eur0(s.overdraft)} more than came in for it; that’s in spent.`
      : s.podmogaNet < 0 ? `In ${esc(d.name)} you passed on money that came in earlier: no loss.` : '';
    pod = `<div class="pod">
      <h3>🔁 Passed on · kept so far</h3>
      <p class="big-kept${po.kept < 0 ? ' neg' : ''}">${eur0(po.kept, true)}</p>
      <p>Only what you keep counts, never the money that just passes through. ${month}</p>

  $('#flow').innerHTML = `

function renderJar() {
  const d = state.view, cur = state.cur, sv = cur.savings, s = d.summary;
  const goal = sv.goalAmount;
  const pct = goal ? clamp(sv.total / goal, 0, 1) : sv.total > 0 ? 0.35 : 0;

  let line;
  if (!goal) line = `<button class="cta-glass" data-act="settings">Name what you’re saving for</button>`;
  else if (!remaining) line = `<div class="eta"><b>Full.</b> Time to name the next one.</div>`;
  else if (months) line = `<div class="eta">At about ${eur0(sv.perMonth)} a month the jar is full by <b>${MONTH[+eta.slice(5) - 1]} ${eta.slice(0, 4)}</b>.</div>`;
  else line = `<div class="eta">Move something to savings and I’ll tell you when it fills up.</div>`;
  $('#jar-copy').innerHTML = `
    <p class="big">${money(sv.total)}</p>
    <p>${goal ? `of ${eur0(goal)}${sv.goalName ? ` for <b>${esc(sv.goalName)}</b>` : ''} · ${Math.round(pct * 100)} %` : 'saved so far'}</p>
    ${s.saved ? `<span class="chip-gold">${eur0(s.saved, true)} in ${esc(d.name)}</span>` : ''}
    ${line}`;

  $('#debts').innerHTML = d.debts?.length ? `<div class="debts"><h3>Paying back</h3>${d.debts.map((o) => {
    const w = (v) => ((100 * v) / Math.max(o.borrowed, 1)).toFixed(1);
    if (o.owed <= 0) return `<div class="debt"><p class="amt">🎉</p><p><b>${esc(o.name)}</b> is paid back in full.</p></div>`;
    return `<div class="debt">
        <p class="amt">${eurExact(o.owed)}</p>
        <p>still owed to <b>${esc(o.name)}</b>. ${o.paid ? `${eurExact(o.paid)} of ${eurExact(o.borrowed)} paid back.` : 'Tap 🤝 Loan on a payment to them and this counts down.'}</p>
        <div class="split" role="img" aria-label="${eurExact(o.paid)} paid back, ${eurExact(o.owed)} to go">${o.paid ? `<i style="--w:${w(o.paid)}%;--c:var(--loan)"></i>` : ''}<i style="--w:${w(o.owed)}%;--c:rgba(255,255,255,.14)"></i></div>
      </div>`;
  }).join('')}</div>` : '';

  const spend = d.tx.filter((t) => t.kind === 'spend' && t.amount < 0);
  const yes = spend.filter((t) => t.worth === 1).reduce((a, t) => a - own(t), 0);
  const no = spend.filter((t) => t.worth === 0).reduce((a, t) => a - own(t), 0);
  const need = spend.filter((t) => t.worth === 2).reduce((a, t) => a - own(t), 0);
  const all = spend.reduce((a, t) => a - own(t), 0);
  const none = all - yes - no - need;
  const by = {};
  for (const t of spend) if (t.worth === 0) by[t.label] = (by[t.label] || 0) - own(t);
  const topLeak = Object.entries(by).sort((a, b) => b[1] - a[1])[0];
  const w = (v) => ((100 * v) / Math.max(all, 1)).toFixed(1);
  const text = no
    ? `you’d take back in ${esc(d.name)}. Biggest leak: <b>${esc(topLeak[0])}</b> (${eur0(topLeak[1])}).`
    : yes || need ? 'No regrets so far. Everything you rated was worth it or necessary.' : 'Rate payments 👍 or 👎 and the leaks show up here.';
  $('#leaks').innerHTML = spend.length ? `<div class="leaks">
      <h3>Leaks</h3>
      <p class="amt">${eur0(no)}</p>

      <div class="split" role="img" aria-label="${eur0(yes)} worth it, ${eur0(no)} regretted, ${eur0(none)} not rated">${yes ? `<i style="--w:${w(yes)}%;--c:var(--good)"></i>` : ''}${need ? `<i style="--w:${w(need)}%;--c:var(--loan)"></i>` : ''}${no ? `<i style="--w:${w(no)}%;--c:var(--bad)"></i>` : ''}${none ? `<i style="--w:${w(none)}%;--c:rgba(255,255,255,.14)"></i>` : ''}</div>
      <div class="split-key"><span>👍 ${eur0(yes)}</span><span>🧱 ${eur0(need)}</span><span>👎 ${eur0(no)}</span><span>unrated ${eur0(none)}</span></div>
      ${state.cur.unrated ? `<button class="cta-glass" data-act="rate" style="margin-top:14px">👍👎 Rate ${state.cur.unrated} payment${state.cur.unrated === 1 ? '' : 's'}</button>` : ''}
      ${no && !reduceMotion ? '<div class="leak-drops" aria-hidden="true"><i style="left:4px;animation-delay:0s"></i><i style="left:20px;animation-delay:1.1s"></i><i style="left:12px;animation-delay:1.9s"></i></div>' : ''}
    </div>` : '';
}

/** One payment. Lists without day headings (a category's payments) show its date instead of the time. */
function rowHTML(t, { date = false, category = true } = {}) {
  const v = visual(t), un = isUnsorted(t);
  const what = (t.kind === 'spend' ? (t.category ? catMeta(t.category).name : 'needs a category') : KIND[t.kind].name) + (t.kind === 'spend' && t.loanPart ? ` · ½ ${t.debt}` : '');
  const worth = (t.worth === 1 ? ' · 👍' : t.worth === 2 ? ' · 🧱' : t.worth === 0 ? ' · 👎' : '') + (t.countsFor ? ` · for ${MONTH[+t.countsFor.slice(5) - 1]}` : '');
  const when = date ? dayLabel(t.ts.slice(0, 10), today()) : t.ts.slice(11, 16);
  return `<button class="row${un ? ' is-unsorted' : ''}" data-act="tx" data-n="${t.n}">
    <span class="drop" style="--c:${v.c}"><span>${un ? '?' : v.icon}</span></span>
    <span class="row-main"><span class="row-name">${esc(t.label)}</span><span class="row-sub">${[category ? what : '', when, t.method].filter(Boolean).map(esc).join(' · ')}${worth}</span></span>
    <span class="row-amt ${UNCOUNTED.has(t.kind) ? 'off' : t.amount > 0 ? 'in' : ''}">${short(t.amount, true)}</span>
  </button>`;
}

function renderLedger() {
  const d = state.view, f = state.filter;
  const unsortedCount = d.tx.filter(isUnsorted).length;
  let list = d.tx;
  if (f === 'unsorted') list = list.filter(isUnsorted);
  else if (f !== 'all') list = list.filter((t) => t.kind === 'spend' && (t.category || 'other') === f);
  const chips = [['all', `All · ${d.tx.length}`], ...(unsortedCount ? [['unsorted', `To sort · ${unsortedCount}`]] : []), ...d.summary.byCategory.map(([c]) => [c, `${catMeta(c).emoji} ${catMeta(c).name}`])];
  let body = '';
  if (!d.tx.length) body = `<div class="empty"><b>${d.current ? 'Still water' : 'Nothing here'}</b>${d.current ? 'Pay as usual; each payment drops in about a minute later.' : 'No payments were recorded this month.'}</div>`;
  else if (!list.length) body = `<div class="empty"><b>No drops here</b>Nothing matches this filter.</div>`;
  else {
    let day = '';
    for (const t of list) {
      const dd = t.ts.slice(0, 10);
      if (dd !== day) {
        day = dd;
        const spent = list.filter((x) => x.ts.startsWith(dd) && x.kind === 'spend').reduce((a, x) => a - own(x), 0);
        body += `<div class="day-head"><span>${esc(dayLabel(dd, d.today))}</span><span>${spent > 0 ? short(spent) : ''}</span></div>`;
      }
      body += rowHTML(t);
    }
  }
  $('#ledger').innerHTML = `
    <h2 class="title" id="ledger-title">Every drop</h2>
    ${unsortedCount ? `<button class="cta-glass" data-act="sort" style="margin-top:16px">Sort ${unsortedCount} payment${unsortedCount === 1 ? '' : 's'}</button>` : ''}
    ${state.cur.unrated ? `<button class="cta-glass" data-act="rate" style="margin-top:16px">👍👎 Rate ${state.cur.unrated}</button>` : ''}
    <div class="filters" role="toolbar" aria-label="Filter payments">${chips.map(([k, l]) => `<button class="filter" data-act="filter" data-f="${k}" aria-pressed="${f === k}">${esc(l)}</button>`).join('')}</div>
    ${body}
    <p class="bottom-line">You’ve reached the bottom of ${esc(d.name)}</p>`;
}

function renderAll() {
  CATS = state.cur.categories;
  const h = new Date().getHours();
  const part = h < 5 ? 'Late swim' : h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
  $('#hello').innerHTML = `${esc(part)}<b>${esc(state.cur.you || TG?.initDataUnsafe?.user?.first_name || 'Your pool')}</b>`;
  renderToday();
  renderMonth();
  renderFlow();
  renderJar();
  renderLedger();
  const badge = $('#rate-badge'), left = state.cur.unrated || 0;
  badge.hidden = !left;
  badge.textContent = left > 99 ? '99+' : String(left);
}

async function load() {
  try {
    state.cur = state.view = await api('/api/summary');
    state.months[state.cur.month] = state.cur;
    renderAll();
    const want = new URLSearchParams(location.search).get('review'); // the bot's "Open the review" button
    if (want && /^\d{4}-\d{2}$/.test(want)) openReview(want);
    if (new URLSearchParams(location.search).has('rate')) openSwiper(); // the bot's /rate button
  } catch (e) {
    $('#num-label').textContent = tg ? 'The pool is unreachable' : 'Open this from your Telegram bot';
    num.dry.textContent = num.wet.textContent = '—';
    $('#num-sub').textContent = e.message;
    $('#deep-info').innerHTML = tg ? '<button class="cta-glass" data-act="retry">Try again</button>' : '';
    requestAnimationFrame(measureNum);
  }
}
async function loadView(month) {
  try {
    state.view = await loadMonth(month);
    state.filter = 'all';
    renderMonth(); renderFlow(); renderJar(); renderLedger();
  } catch (e) { toast(e.message); }
}
function accept(d) {
  state.months[d.month] = d;
  if (d.month === state.cur.month) state.cur = d;
  if (d.month === state.view.month) state.view = d;
  renderAll();
}
/** A month's data: the freshest copy we have (every change returns its month, which accept() keeps). */
const monthData = (m) => state.months[m] || (m === state.cur.month ? state.cur : m === state.view.month ? state.view : null);
async function loadMonth(m) {
  if (monthData(m)) return monthData(m);
  return (state.months[m] = await api(`/api/summary?month=${m}`));
}

/* =========================================================================
   Rate by swiping: right worth it, left not worth it, up necessary.
   Each card holds the payment's liquid, in its category's colour, filled by
   how big it was; it sloshes when you drag the card or tilt the phone.
   ========================================================================= */
const RATE = { right: 1, up: 2, left: 0 };
const swipe = { open: false, busy: false, list: [], i: 0, history: [], session: { 0: 0, 1: 0, 2: 0 }, cards: [], max: 1 };
const rgbOf = (el) => {
  const v = getComputedStyle(el).getPropertyValue('--c').trim();
  const m = v.match(/^#([0-9a-f]{3}|[0-9a-f]{6})$/i);
  if (!m) return AQUA;
  const h = m[1].length === 3 ? [...m[1]].map((c) => c + c).join('') : m[1];
  return [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16));
};

async function openSwiper() {
  haptic.pick();
  closeSheet();
  const el = $('#swiper');
  Object.assign(swipe, { open: true, busy: false, list: [], i: 0, history: [], session: { 0: 0, 1: 0, 2: 0 }, cards: [] });
  el.hidden = false;
  requestAnimationFrame(() => el.classList.add('open'));
  tg?.BackButton?.show();
  $('#sw-count').textContent = '';
  $('#sw-deck').innerHTML = '';
  try {
    swipe.list = (await api('/api/unrated')).tx;
    swipe.max = Math.max(1, ...swipe.list.map((t) => -own(t)));
    renderDeck('rise');
  } catch (e) { toast(e.message); closeSwiper(); }
}
function closeSwiper() {

function swipeDoneHTML() {

  return `<div class="sw-done"><div class="done-art">💧</div><h2>${rated ? 'All rated' : 'Nothing to rate'}</h2>
    <p>${rated ? `This round: 👍 <b>${eur0(s[1])}</b> worth it · 🧱 <b>${eur0(s[2])}</b> necessary · 👎 <b>${eur0(s[0])}</b> not.${s[0] ? ` That last one is what next month can skip.` : ''}` : 'Every payment already has its verdict.'}</p>
    <button type="button" class="primary" data-act="swipe-close">Back to the water</button></div>`;

function renderDeck(enter) {
  const deck = $('#sw-deck'), left = swipe.list.length - swipe.i;
  $('#sw-count').textContent = left ? `${left} to go · swipe or tap below` : '';
  $('[data-act="swipe-back"]').disabled = !swipe.history.length;
  for (const b of $$('[data-act="swipe"]')) b.disabled = !left;
  if (!left) { swipe.cards = []; deck.innerHTML = swipeDoneHTML(); return; }
  const shown = swipe.list.slice(swipe.i, swipe.i + 2);
  deck.innerHTML = shown.map(swipeCardHTML).reverse().join(''); // the next card first, so the top one sits above it
  swipe.cards = shown.map((t, k) => {
    const el = deck.querySelector(`[data-n="${t.n}"]`), canvas = el.querySelector('canvas');
    const W = el.offsetWidth, H = el.offsetHeight, dpr = Math.min(2, devicePixelRatio || 1);
    canvas.width = W * dpr; canvas.height = H * dpr;
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    if (k === 1) el.classList.add('next');
    else if (enter) el.classList.add(enter === 'rise' ? 'rise' : `enter-${enter}`);
    const fill = 0.16 + 0.44 * Math.sqrt(Math.min(1, -own(t) / swipe.max)); // bigger payment, more liquid
    return { el, t, ctx, W, H, wave: new Wave(36), level: k ? fill : 0, levelTarget: fill, drag: 0, rgb: rgbOf(el),
      fizz: Array.from({ length: 8 }, () => ({ x: 0.1 + Math.random() * 0.8, y: Math.random(), r: 1 + Math.random() * 2.2, sp: 0.0015 + Math.random() * 0.003, ph: Math.random() * 6 })) };
  });
  dragCard(swipe.cards[0]);
}

function drawSwipeCard(cd, now) {
  const { ctx: c, W, H, wave } = cd;
  cd.level += (cd.levelTarget - cd.level) * 0.045;
  wave.tilt += (cd.drag + tiltTarget * 0.7 - wave.tilt) * 0.12;
  wave.step();
  c.clearRect(0, 0, W, H);
  const base = H * (1 - cd.level), N = 36;
  const surface = (k) => base + wave.at(k / N) * 0.8;
  const liquid = new Path2D();
  liquid.moveTo(0, H);
  for (let k = 0; k <= N; k++) liquid.lineTo((k / N) * W, surface(k));
  liquid.lineTo(W, H);
  liquid.closePath();
  const g = c.createLinearGradient(0, base - 30, 0, H);
  g.addColorStop(0, rgba(cd.rgb, 0.9));
  g.addColorStop(1, rgba(mix(cd.rgb, DEEP, 0.6), 1));
  c.fillStyle = g;
  c.fill(liquid);
  c.save();
  c.clip(liquid);
  for (const f of cd.fizz) {
    if (!reduceMotion) { f.y -= f.sp; if (f.y * H < base + 6) { f.y = 1.02; f.x = 0.1 + Math.random() * 0.8; } }
    c.fillStyle = 'rgba(255,255,255,.32)';
    c.beginPath(); c.arc(f.x * W + Math.sin(now / 320 + f.ph) * 2.5, f.y * H, f.r, 0, Math.PI * 2); c.fill();
  }
  c.restore();
  c.strokeStyle = 'rgba(255,255,255,.65)';
  c.lineWidth = 1.6;
  c.beginPath();
  for (let k = 0; k <= N; k++) c.lineTo((k / N) * W, surface(k));
  c.stroke();
}

function stampsFor(cd, dx, dy) {
  const T = 110, upness = -dy > Math.abs(dx) ? clamp(-dy / T, 0, 1) : 0;
  cd.el.querySelector('.sw-stamp.yes').style.opacity = upness ? 0 : clamp(dx / T, 0, 1);
  cd.el.querySelector('.sw-stamp.no').style.opacity = upness ? 0 : clamp(-dx / T, 0, 1);
  cd.el.querySelector('.sw-stamp.need').style.opacity = upness;
}
function nextFollows(dx, dy) {
  const nx = swipe.cards[1];
  if (!nx) return;
  const p = clamp(Math.hypot(dx, dy) / 150, 0, 1);
  nx.el.style.transition = 'none';
  nx.el.style.transform = `translateY(${(16 * (1 - p)).toFixed(1)}px) scale(${(0.94 + 0.06 * p).toFixed(3)})`;
  nx.el.style.opacity = String(0.75 + 0.25 * p);
}
function dragCard(cd) {
  const el = cd.el;
  let id = null, sx = 0, sy = 0, lx = 0, lt = 0, vx = 0, vy = 0;
  el.addEventListener('pointerdown', (e) => {
    if (swipe.busy || id !== null) return;
    id = e.pointerId; el.setPointerCapture(id);
    sx = lx = e.clientX; sy = e.clientY; lt = performance.now(); vx = vy = 0;
    el.style.transition = 'none';
    el.classList.remove('rise', 'enter-left', 'enter-right', 'enter-up');
    cd.wave.poke(clamp(e.offsetX / cd.W, 0, 1), 7);
    haptic.soft();
  });
  el.addEventListener('pointermove', (e) => {
    if (e.pointerId !== id) return;
    const dx = e.clientX - sx, dy = e.clientY - sy, now = performance.now(), dt = Math.max(1, now - lt);
    vx = (e.clientX - lx) / dt; vy = e.movementY / dt || vy; lx = e.clientX; lt = now;
    el.style.transform = `translate(${dx}px, ${dy}px) rotate(${(dx * 0.06).toFixed(2)}deg)`;
    cd.drag = clamp(-dx * 0.4, -80, 80); // the liquid lags behind the card
    if (Math.abs(vx) > 0.4) cd.wave.poke(vx > 0 ? 0.08 : 0.92, clamp(vx * 2.5, -6, 6));
    stampsFor(cd, dx, dy);
    nextFollows(dx, dy);
  });
  const end = (e) => {
    if (e.pointerId !== id) return;
    id = null;
    const dx = e.clientX - sx, dy = e.clientY - sy, T = Math.min(110, innerWidth * 0.26);
    const dir = -dy > T && -dy > Math.abs(dx) ? 'up' : dx > T || (vx > 0.9 && dx > 30) ? 'right' : dx < -T || (vx < -0.9 && dx < -30) ? 'left' : null;
    if (dir) return fling(dir);
    el.style.transition = '';
    el.style.transform = '';
    cd.drag = 0;
    cd.wave.poke(0.5, clamp(dx / 20, -8, 8)); // it settles with a slosh
    stampsFor(cd, 0, 0);
    const nx = swipe.cards[1];
    if (nx) { nx.el.style.transition = ''; nx.el.style.transform = ''; nx.el.style.opacity = ''; }
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
}

function fling(dir) {
  const cd = swipe.cards[0];
  if (!cd || swipe.busy) return;
  swipe.busy = true;
  const t = cd.t, worth = RATE[dir];
  dir === 'left' ? haptic.err?.() : haptic.ok();
  stampsFor(cd, dir === 'right' ? 200 : dir === 'left' ? -200 : 0, dir === 'up' ? -200 : 0);
  nextFollows(200, 0);
  const el = cd.el;
  el.style.transition = reduceMotion ? 'none' : 'transform .34s cubic-bezier(.5,0,.75,0), opacity .34s';
  el.style.transform = dir === 'up' ? `translate(0, ${-innerHeight}px)` : `translate(${(dir === 'right' ? 1.3 : -1.3) * innerWidth}px, 40px) rotate(${dir === 'right' ? 22 : -22}deg)`;
  el.style.opacity = '0';
  swipe.history.push({ t, i: swipe.i, dir });
  swipe.session[worth] -= own(t);
  swipe.i++;
  state.cur.unrated = Math.max(0, (state.cur.unrated || 0) - 1);
  // Saved in the background: the next card is already there.
  api('/api/tx', { n: t.n, worth, quiet: true }).catch((e) => toast(`Couldn’t save ${t.label}: ${e.message}`));
  setTimeout(() => { swipe.busy = false; renderDeck('rise'); }, reduceMotion ? 0 : 230);
}
/** Back to the last card: its rating is taken back, and it returns from where it went. */
function swipeBack() {
  const h = swipe.history.pop();
  if (!h || swipe.busy) return;
  haptic.pick();
  swipe.i = h.i;
  swipe.session[RATE[h.dir]] += own(h.t);
  state.cur.unrated = (state.cur.unrated || 0) + 1;
  api('/api/tx', { n: h.t.n, worth: null, quiet: true }).catch((e) => toast(e.message));
  renderDeck(h.dir);
}
document.addEventListener('keydown', (e) => {
  if (!swipe.open) return;
  const dir = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up' }[e.key];
  if (dir) { e.preventDefault(); fling(dir); }
  else if (e.key === 'Backspace') { e.preventDefault(); swipeBack(); }
  else if (e.key === 'Escape') closeSwiper();
});
