name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Point wrangler.toml at your D1 database
        run: sed -i "s/__D1_DATABASE_ID__/${{ vars.D1_DATABASE_ID }}/" wrangler.toml
      - run: npx wrangler d1 migrations apply money --remote
      - run: npx wrangler deploy

      - name: Upload secrets
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_SECRET: ${{ secrets.TELEGRAM_SECRET }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          OWN_IBANS: ${{ secrets.OWN_IBANS }}
        # Only the secrets you have set are uploaded; CHAT_ID and OWN_IBANS can come later.
        run: |
          node -e '
            const names = ["TELEGRAM_TOKEN", "TELEGRAM_SECRET", "INGEST_SECRET", "CHAT_ID", "OWN_IBANS"];
            const set = Object.fromEntries(names.filter((n) => process.env[n]).map((n) => [n, process.env[n]]));
            require("fs").writeFileSync("secrets.json", JSON.stringify(set));'
          npx wrangler secret bulk secrets.json
          rm secrets.json
