name: Deploy

# Needs three repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, TELEGRAM_TOKEN.
# Everything else (database, schema, Worker, bot webhook) is created or updated here.
on:
  push:
    branches: [main]
    paths-ignore: ["nation/**", ".github/workflows/nation.yml"] # the talk site has its own workflow
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash # -eo pipefail, so `wrangler deploy | tee` still fails the job on errors
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
    steps:
      - name: Check the three required secrets
        run: |
          missing=""
          for n in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID TELEGRAM_TOKEN; do [ -n "${!n}" ] || missing="$missing $n"; done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Add them under Settings → Secrets and variables → Actions, then re-run this workflow (see README → Setup)."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Find or create the D1 database
        run: |
          find_db() { npx wrangler d1 list --json | node -e 'const l = JSON.parse(require("fs").readFileSync(0, "utf8")); process.stdout.write((l.find((d) => d.name === "money") || {}).uuid || "")'; }
          id=$(find_db)
          if [ -z "$id" ]; then npx wrangler d1 create money; id=$(find_db); fi
          sed -i "s/__D1_DATABASE_ID__/$id/" wrangler.toml
      - run: npx wrangler d1 migrations apply money --remote
      - run: npx wrangler deploy | tee deploy.log

      - name: Upload secrets
        env:
          TELEGRAM_SECRET: ${{ secrets.TELEGRAM_SECRET }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          OWN_IBANS: ${{ secrets.OWN_IBANS }}
        # Only TELEGRAM_TOKEN is required; the others are uploaded when you've set them.
        run: |
          node -e '
            const names = ["TELEGRAM_TOKEN", "TELEGRAM_SECRET", "INGEST_SECRET", "CHAT_ID", "OWN_IBANS"];
            const set = Object.fromEntries(names.filter((n) => process.env[n]).map((n) => [n, process.env[n]]));
            require("fs").writeFileSync("secrets.json", JSON.stringify(set));'
          npx wrangler secret bulk secrets.json
          rm secrets.json

      - name: Connect the Telegram bot
        env:
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: |
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          # Same derivation as derivedSecret() in src/auth.ts, unless you set INGEST_SECRET yourself.
          key=${INGEST_SECRET:-$(node -e 'process.stdout.write(require("crypto").createHmac("sha256", process.env.TELEGRAM_TOKEN).update("money:ingest").digest("hex").slice(0, 40))')}
          echo "::add-mask::$key"
          # A brand-new workers.dev subdomain needs a few minutes before its DNS and certificate work.
          curl -fsS --retry 30 --retry-delay 10 --retry-all-errors -X POST "$url/setup" -H "authorization: Bearer $key" | tee setup.json
          bot=$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync("setup.json", "utf8")).bot || "")')
          {
            echo "### Deployed"
            echo "Open your bot and send **/start**: $bot"
            echo "Dashboard (opens from the bot's menu button): $url/app"
          } >> "$GITHUB_STEP_SUMMARY"
